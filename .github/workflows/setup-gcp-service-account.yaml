name: Setup GCP Service Account

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy
      gcp_account_name:
        description: 'GCP Account Name for logging / verification'
        required: true
        default: 'maheshrajannan'
        type: choice
        options:
          - maheshrajannan
          - empowerinnovate
          - custom
      gcp_custom_account_name:
        description: 'Custom GCP Account Name (used only if GCP Account Name above is set to "custom")'
        required: false
        type: string
      gcp_project_id:
        description: 'GCP Project ID'
        required: true
        default: 'concrete-detection-1-491711'
        type: string
      gcp_sa_key_base64:
        description: 'GCP Service Account JSON key base64 single-line. If blank, secrets.MAHESH_GCP_SERVICE_ACCOUNT_KEY is used.'
        required: false
        type: string
      gcp_backend_bucket:
        description: 'GCS bucket name for Terraform backend'
        required: true
        default: 'crack-detection-terraform'
        type: choice
        options:
          - crack-detection-terraform
          - crack-detection-terraform-1
          - custom
      gcp_custom_backend_bucket:
        description: 'Custom GCS bucket name (used only if GCS bucket name above is set to "custom")'
        required: false
        type: string
      gcp_region:
        description: 'GCP Region'
        required: true
        default: 'us-central1'
        type: string
      gcp_sa_name:
        description: 'GCP Service Account Name'
        required: true
        default: 'crack-detection-1'
        type: string

jobs:
  terraform-createServiceAccount:
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_id: ${{ github.event.inputs.gcp_project_id }}
      TF_VAR_region: ${{ github.event.inputs.gcp_region }}
      TF_VAR_sa_name: ${{ github.event.inputs.gcp_sa_name }}

    defaults:
      run:
        working-directory: ./gcp-service-account

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Print Account & Target Info
        run: |
          ACCT="${{ github.event.inputs.gcp_account_name }}"
          if [ "$ACCT" = "custom" ]; then
            ACCT="${{ github.event.inputs.gcp_custom_account_name }}"
          fi
          if [ -z "$ACCT" ]; then
            ACCT="maheshrajannan"
          fi
          RAW_KEY="${{ github.event.inputs.gcp_sa_key_base64 }}"
          if [ -n "$RAW_KEY" ]; then
            KEY_15="${RAW_KEY:0:15}"
            SPACED_15=$(echo "$KEY_15" | sed 's/./& /g')
          else
            SPACED_15="Using default secret key"
          fi
          echo "======================================================"
          echo " Target GCP Account Name: $ACCT"
          echo " GCP Project ID:          ${{ github.event.inputs.gcp_project_id }}"
          echo " SA Key Preview (15 chars): $SPACED_15"
          echo "======================================================"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verify Input Token & Decode GCP SA Key
        run: |
          if [ -n "${{ github.event.inputs.gcp_sa_key_base64 }}" ]; then
            RAW_INPUT="${{ github.event.inputs.gcp_sa_key_base64 }}"
            KEY_15="${RAW_INPUT:0:15}"
            SPACED_15=$(echo "$KEY_15" | sed 's/./& /g')
            echo "First 15 characters of provided SA key token (raw): ${KEY_15}"
            echo "First 15 characters of provided SA key token (spaced): ${SPACED_15}"
            DECODED_KEY=$(echo "$RAW_INPUT" | base64 -d | tr -d '\r\n')
            echo "::add-mask::$DECODED_KEY"
            echo "DECODED_GCP_SA_KEY=$DECODED_KEY" >> $GITHUB_ENV
          else
            echo "No custom base64 SA key provided in input. Using default secrets.MAHESH_GCP_SERVICE_ACCOUNT_KEY."
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ env.DECODED_GCP_SA_KEY || secrets.MAHESH_GCP_SERVICE_ACCOUNT_KEY }}'

      - name: Debug - List files
        run: ls -la ./
        working-directory: ${{ github.workspace }}
        
      - name: Terraform Init
        run: |
          BUCKET="${{ github.event.inputs.gcp_backend_bucket }}"
          if [ "$BUCKET" = "custom" ]; then
            BUCKET="${{ github.event.inputs.gcp_custom_backend_bucket }}"
          fi
          if [ -z "$BUCKET" ]; then
            BUCKET="crack-detection-terraform"
          fi
          terraform init -backend-config="bucket=$BUCKET"
        
      - name: Terraform Plan (Apply)
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform plan -input=false

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -auto-approve

      - name: Terraform Plan (Destroy with targets)
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          terraform plan -destroy -input=false \
            -target=google_service_account.crack_detection_sa \
            -target=google_project_iam_member.sa_roles

      - name: Terraform Destroy (with targets)
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          terraform destroy -auto-approve \
            -target=google_service_account.crack_detection_sa \
            -target=google_project_iam_member.sa_roles