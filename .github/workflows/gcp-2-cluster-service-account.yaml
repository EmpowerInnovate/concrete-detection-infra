name: GCP 2 - Cluster service account + key

# Pipeline 2 of 3 (see gcp-keys/README.md):
#   Signs in with the MAIN service account key (from pipeline 1), runs the Terraform in
#   gcp-service-account/ to create the cluster service account (e.g. crack-detection-1) with its
#   roles - an existing one is reused, never created twice - then creates a NEW JSON key for it and
#   offers it as a download (JSON + single-line base64), encrypted to the SSH public key(s) in
#   gcp-keys/recipients.txt so only you can open it (the repo is public).
#
# Next: decrypt it with gcp-keys/decrypt-key.sh and paste the .b64 into "GCP 3 - GKE cluster".
#
# No GitHub secrets are used.

on:
  workflow_dispatch:
    inputs:
      gcp_project_id:
        description: 'GCP project ID'
        required: true
        default: 'concrete-detection-8'
        type: string
      cluster_sa_name:
        description: 'Cluster service account ID (created only if missing)'
        required: true
        default: 'crack-detection-1'
        type: string
      main_sa_key_base64:
        description: 'MAIN service account key from pipeline 1 (contents of the .json.b64 file)'
        required: true
        type: string
      state_bucket:
        description: 'GCS bucket for Terraform state (must exist)'
        required: true
        default: 'crack-detection-terraform-1'
        type: string
      gcp_region:
        description: 'GCP region'
        required: true
        default: 'us-central1'
        type: string
      delete_old_keys:
        description: 'Delete the cluster account''s existing keys first (max 10 per account; old keys stop working)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gcp-sa-${{ inputs.gcp_project_id }}-${{ inputs.cluster_sa_name }}
  cancel-in-progress: false

jobs:
  cluster-sa:
    name: Cluster service account + encrypted key
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ inputs.gcp_project_id }}
      SA_EMAIL: ${{ inputs.cluster_sa_name }}@${{ inputs.gcp_project_id }}.iam.gserviceaccount.com
      TF_VAR_project_id: ${{ inputs.gcp_project_id }}
      TF_VAR_region: ${{ inputs.gcp_region }}
      TF_VAR_sa_name: ${{ inputs.cluster_sa_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Sign in with the main service account key
        env:
          KEY_B64: ${{ inputs.main_sa_key_base64 }}
        run: bash gcp-keys/login-with-key.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # One state per project + account, so creating crack-detection-2 never touches crack-detection-1.
      - name: Terraform init
        working-directory: ./gcp-service-account
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="prefix=gcp-service-account/$PROJECT_ID/${{ inputs.cluster_sa_name }}"

      # The account may exist already (made earlier, or by the old setup workflow): adopt it
      # into this state instead of failing with "already exists".
      - name: Reuse the account if it already exists
        working-directory: ./gcp-service-account
        run: |
          if terraform state list 2>/dev/null | grep -qx 'google_service_account.crack_detection_sa'; then
            echo "Already managed by this Terraform state."
          elif gcloud iam service-accounts describe "$SA_EMAIL" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "$SA_EMAIL already exists - reusing it (not creating it again)."
            terraform import -input=false google_service_account.crack_detection_sa \
              "projects/$PROJECT_ID/serviceAccounts/$SA_EMAIL"
          else
            echo "$SA_EMAIL does not exist yet - Terraform will create it."
          fi

      - name: Terraform apply (account + roles)
        working-directory: ./gcp-service-account
        run: |
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: Create JSON key + base64 (encrypted to your SSH key)
        id: key
        env:
          DELETE_OLD_KEYS: ${{ inputs.delete_old_keys }}
        run: bash gcp-keys/encrypted-key.sh "$SA_EMAIL" "$PROJECT_ID" "$RUNNER_TEMP/out"

      - name: Upload encrypted key
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.name }}-key-encrypted
          path: ${{ steps.key.outputs.file }}
          retention-days: 1
          if-no-files-found: error

      - name: Sign out, remove temporary key
        if: always()
        run: bash gcp-keys/logout-key.sh

      - name: Summary
        if: success()
        run: |
          {
            echo "### Cluster service account ready"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Account | \`$SA_EMAIL\` |"
            echo "| New key ID | \`${{ steps.key.outputs.key_id }}\` |"
            echo "| Terraform state | \`gs://${{ inputs.state_bucket }}/gcp-service-account/$PROJECT_ID/${{ inputs.cluster_sa_name }}\` |"
            echo "| Download | **Artifacts → ${{ steps.key.outputs.name }}-key-encrypted** (kept 1 day) |"
            echo
            echo "**Next:**"
            echo '```bash'
            echo "bash gcp-keys/decrypt-key.sh ~/Downloads/${{ steps.key.outputs.name }}-key-encrypted.zip"
            echo '```'
            echo "Then run **GCP 3 - GKE cluster** and paste the contents of \`e2e/output/${{ steps.key.outputs.name }}-key.json.b64\` into \`cluster_sa_key_base64\`."
          } >> "$GITHUB_STEP_SUMMARY"
