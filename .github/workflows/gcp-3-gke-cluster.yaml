name: GCP 3 - GKE cluster

# Pipeline 3 of 3 (see gcp-keys/README.md):
#   Signs in with the CLUSTER service account key from pipeline 2 (pasted as single-line base64)
#   and creates/updates (apply) or deletes (destroy) the GKE cluster with the Terraform in gcp-cluster/.
#
# State: gs://<state_bucket>/gke/<cluster_name> - the same place deploy-kubernetes-cluster.yaml uses.
# No GitHub secrets are used.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'apply = create/update the cluster | destroy = delete it'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy
      gcp_project_id:
        description: 'GCP project ID'
        required: true
        default: 'concrete-detection-8'
        type: string
      cluster_sa_key_base64:
        description: 'CLUSTER service account key from pipeline 2 (contents of the .json.b64 file)'
        required: true
        type: string
      cluster_name:
        description: 'Cluster name'
        required: true
        default: 'crack-detection-cluster'
        type: string
      zone:
        description: 'Zone'
        required: true
        default: 'us-central1-a'
        type: string
      state_bucket:
        description: 'GCS bucket for Terraform state (must exist)'
        required: true
        default: 'crack-detection-terraform-1'
        type: string

permissions:
  contents: read

# Never run two applies/destroys on the same cluster at once.
concurrency:
  group: gke-${{ inputs.gcp_project_id }}-${{ inputs.cluster_name }}
  cancel-in-progress: false

jobs:
  cluster:
    name: GKE cluster (${{ inputs.action }})
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.action }}
      PROJECT_ID: ${{ inputs.gcp_project_id }}
      CLUSTER_NAME: ${{ inputs.cluster_name }}
      ZONE: ${{ inputs.zone }}
      STATE_BUCKET: ${{ inputs.state_bucket }}
      TF_VAR_project_id: ${{ inputs.gcp_project_id }}
      TF_VAR_cluster_name: ${{ inputs.cluster_name }}
      TF_VAR_zone: ${{ inputs.zone }}
    defaults:
      run:
        working-directory: ./gcp-cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up gcloud + kubectl
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin,kubectl'

      - name: Sign in with the cluster service account key
        working-directory: .
        env:
          KEY_B64: ${{ inputs.cluster_sa_key_base64 }}
        run: bash gcp-keys/login-with-key.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="prefix=gke/$CLUSTER_NAME"

      - name: Terraform plan
        run: |
          if [ "$ACTION" = "destroy" ]; then
            terraform plan -input=false -destroy -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      # Load balancers and NEGs created by Kubernetes block deleting the network otherwise.
      - name: Pre-destroy cleanup (load balancers, NEGs)
        if: inputs.action == 'destroy'
        run: |
          if gcloud container clusters get-credentials "$CLUSTER_NAME" --zone "$ZONE" --project "$PROJECT_ID"; then
            helm list -A -q | xargs -r -I {} helm uninstall {} || true
            kubectl delete ingress --all --all-namespaces || true
            kubectl delete svc --all --all-namespaces --field-selector metadata.name!=kubernetes || true
            echo "Waiting 60 s for GCP load balancers to be removed..."
            sleep 60
          fi
          for neg in $(gcloud compute network-endpoint-groups list --filter="zone:($ZONE)" --project="$PROJECT_ID" --format='value(name)' 2>/dev/null); do
            gcloud compute backend-services delete "$neg" --global --quiet --project="$PROJECT_ID" || true
            gcloud compute network-endpoint-groups delete "$neg" --zone="$ZONE" --quiet --project="$PROJECT_ID" || true
          done

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Delete SSL certificates and static IP left by the app
        if: inputs.action == 'destroy'
        run: |
          for cert in $(gcloud compute ssl-certificates list --project="$PROJECT_ID" --format='value(name)' 2>/dev/null); do
            gcloud compute ssl-certificates delete "$cert" --project="$PROJECT_ID" --quiet || true
          done
          gcloud compute addresses delete concrete-detection-ip --global --project="$PROJECT_ID" --quiet 2>/dev/null || true

      - name: Sign out, remove temporary key
        if: always()
        working-directory: .
        run: bash gcp-keys/logout-key.sh

      - name: Summary
        if: always()
        working-directory: .
        run: |
          {
            echo "### GKE cluster \`$CLUSTER_NAME\` - $ACTION: ${{ job.status }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Project | \`$PROJECT_ID\` |"
            echo "| Zone | \`$ZONE\` |"
            echo "| Terraform state | \`gs://$STATE_BUCKET/gke/$CLUSTER_NAME\` |"
            if [ "$ACTION" = "apply" ]; then
              echo
              echo "Connect:"
              echo '```bash'
              echo "gcloud container clusters get-credentials $CLUSTER_NAME --zone $ZONE --project $PROJECT_ID"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
