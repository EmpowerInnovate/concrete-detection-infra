name: GCP 1 - Main service account + key

# Pipeline 1 of 3 (see gcp-keys/README.md):
#   Creates the main (admin) service account if it doesn't exist yet - an existing one is reused,
#   never created twice - gives it the 5 admin roles, then creates a NEW JSON key for it and offers
#   it as the run's artifact: <account>-key.json.b64 (single-line base64) + <account>-key.json.
#
# Next: download the artifact, unzip it, and paste the .json.b64 one-liner into
#       "GCP 2 - Cluster service account + key".
#
# Signs in with an existing key that has Owner on the project, pasted as single-line base64.
# No GitHub secrets are used.
#
# Artifacts of a PUBLIC repository can be downloaded by anyone signed in to GitHub, so on a public
# repo the run stops before creating a key unless allow_public_repo is ticked. Keep the repo private.

on:
  workflow_dispatch:
    inputs:
      gcp_project_id:
        description: 'GCP project ID'
        required: true
        default: 'concrete-detection-8'
        type: string
      main_sa_id:
        description: 'Main service account ID (created only if missing)'
        required: true
        default: 'empowerinnovate-sa-1'
        type: string
      owner_key_base64:
        description: 'Key of an account with Owner on the project, base64 single-line'
        required: true
        type: string
      delete_old_keys:
        description: 'Delete the main account''s existing keys first (max 10 per account; old keys stop working)'
        required: false
        default: false
        type: boolean
      allow_public_repo:
        description: 'Also run if this repository is PUBLIC (anyone could then download the key artifact)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  main-sa:
    name: Main service account + key (one-line base64)
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ inputs.gcp_project_id }}
      SA_EMAIL: ${{ inputs.main_sa_id }}@${{ inputs.gcp_project_id }}.iam.gserviceaccount.com
    steps:
      - name: Check repository visibility
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
          ALLOW_PUBLIC: ${{ inputs.allow_public_repo }}
        run: |
          if [ "$IS_PRIVATE" = "true" ]; then
            echo "Repository is private - the key artifact is visible only to people with access."
          elif [ "$ALLOW_PUBLIC" = "true" ]; then
            echo "::warning::Repository is PUBLIC and allow_public_repo is ticked: anyone signed in to GitHub can download the key artifact for 1 day."
          else
            echo "::error::This repository is PUBLIC: anyone signed in to GitHub could download the key artifact. Make it private (Settings -> General -> Danger Zone -> Change visibility), or run again with allow_public_repo ticked. No key was created."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Sign in with the owner key
        env:
          KEY_B64: ${{ inputs.owner_key_base64 }}
        run: bash gcp-keys/login-with-key.sh

      - name: Main service account + 5 roles (created only if missing)
        run: bash gcp-keys/main-sa.sh "$PROJECT_ID" "${{ inputs.main_sa_id }}"

      - name: Create JSON key + single-line base64
        id: key
        env:
          DELETE_OLD_KEYS: ${{ inputs.delete_old_keys }}
        run: bash gcp-keys/make-key.sh "$SA_EMAIL" "$PROJECT_ID" "$RUNNER_TEMP/out"

      - name: Upload key (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.name }}-key
          path: ${{ steps.key.outputs.dir }}
          retention-days: 1
          if-no-files-found: error

      - name: Sign out, remove keys from the runner
        if: always()
        run: |
          bash gcp-keys/logout-key.sh
          rm -rf "$RUNNER_TEMP/out"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Main service account ready"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Account | \`$SA_EMAIL\` |"
            echo "| New key ID | \`${{ steps.key.outputs.key_id }}\` |"
            echo "| Download | **Artifacts → ${{ steps.key.outputs.name }}-key** (kept 1 day) |"
            echo
            echo "**Next:** download **${{ steps.key.outputs.name }}-key**, unzip it, and paste the contents of \`${{ steps.key.outputs.name }}-key.json.b64\` (one line) into \`main_sa_key_base64\` of **GCP 2 - Cluster service account + key**:"
            echo '```bash'
            echo "unzip -o ~/Downloads/${{ steps.key.outputs.name }}-key.zip -d e2e/output && cat e2e/output/${{ steps.key.outputs.name }}-key.json.b64"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
