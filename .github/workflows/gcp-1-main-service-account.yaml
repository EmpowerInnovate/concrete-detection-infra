name: GCP 1 - Main service account + key

# Pipeline 1 of 3 (see gcp-keys/README.md):
#   Creates the main (admin) service account if it doesn't exist yet - an existing one is reused,
#   never created twice - gives it the 5 admin roles, then creates a NEW JSON key for it and offers
#   it as a download (JSON + single-line base64), encrypted to the SSH public key(s) in
#   gcp-keys/recipients.txt so only you can open it (the repo is public).
#
# Next: decrypt it with gcp-keys/decrypt-key.sh and paste the .b64 into
#       "GCP 2 - Cluster service account + key".
#
# Signs in with an existing key that has Owner on the project, pasted as single-line base64.
# No GitHub secrets are used.

on:
  workflow_dispatch:
    inputs:
      gcp_project_id:
        description: 'GCP project ID'
        required: true
        default: 'concrete-detection-8'
        type: string
      main_sa_id:
        description: 'Main service account ID (created only if missing)'
        required: true
        default: 'empowerinnovate-sa-1'
        type: string
      owner_key_base64:
        description: 'Key of an account with Owner on the project, base64 single-line'
        required: true
        type: string
      delete_old_keys:
        description: 'Delete the main account''s existing keys first (max 10 per account; old keys stop working)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  main-sa:
    name: Main service account + encrypted key
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ inputs.gcp_project_id }}
      SA_EMAIL: ${{ inputs.main_sa_id }}@${{ inputs.gcp_project_id }}.iam.gserviceaccount.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Sign in with the owner key
        env:
          KEY_B64: ${{ inputs.owner_key_base64 }}
        run: bash gcp-keys/login-with-key.sh

      - name: Main service account + 5 roles (created only if missing)
        run: bash gcp-keys/main-sa.sh "$PROJECT_ID" "${{ inputs.main_sa_id }}"

      - name: Create JSON key + base64 (encrypted to your SSH key)
        id: key
        env:
          DELETE_OLD_KEYS: ${{ inputs.delete_old_keys }}
        run: bash gcp-keys/encrypted-key.sh "$SA_EMAIL" "$PROJECT_ID" "$RUNNER_TEMP/out"

      - name: Upload encrypted key
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.name }}-key-encrypted
          path: ${{ steps.key.outputs.file }}
          retention-days: 1
          if-no-files-found: error

      - name: Sign out, remove temporary key
        if: always()
        run: bash gcp-keys/logout-key.sh

      - name: Summary
        if: success()
        run: |
          {
            echo "### Main service account ready"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Account | \`$SA_EMAIL\` |"
            echo "| New key ID | \`${{ steps.key.outputs.key_id }}\` |"
            echo "| Download | **Artifacts → ${{ steps.key.outputs.name }}-key-encrypted** (kept 1 day) |"
            echo
            echo "**Next:**"
            echo '```bash'
            echo "bash gcp-keys/decrypt-key.sh ~/Downloads/${{ steps.key.outputs.name }}-key-encrypted.zip"
            echo '```'
            echo "Then run **GCP 2 - Cluster service account + key** and paste the contents of \`e2e/output/${{ steps.key.outputs.name }}-key.json.b64\` into \`main_sa_key_base64\`."
          } >> "$GITHUB_STEP_SUMMARY"
