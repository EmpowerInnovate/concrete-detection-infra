name: Deploy Kubernetes Cluster (GCP / DigitalOcean / Azure AKS / AWS EKS)

# ===========================================================
# HOW TO USE THIS PIPELINE
# ===========================================================
# GCP users:
#   1. Get your service account JSON key file
#   2. Base64 encode it into a SINGLE LINE (no line breaks):
#      Linux:   base64 -w 0 key.json
#      Mac:     base64 -i key.json | tr -d '\n'
#      Windows: [Convert]::ToBase64String([IO.File]::ReadAllBytes("key.json"))
#   3. Paste the single-line output into gcp_sa_key_base64 input
#
# DigitalOcean users:
#   1. Get your API token from https://cloud.digitalocean.com/account/api/tokens
#   2. Fill in the DO inputs below when triggering the workflow
#
# Azure (AKS) users:
#   1. Run "Setup Azure Service Principal & Backend" workflow or use existing SP
#   2. Fill in the Azure inputs (azure_subscription_id, azure_tenant_id,
#      azure_client_id, azure_client_secret, azure_storage_account)
#
# AWS (EKS) users:
#   1. Run "Setup AWS IAM User & Backend" workflow (or aws-iam-user/bootstrap-aws.sh)
#   2. Create an access key for the deployer IAM user in the AWS console
#   3. Fill in the AWS inputs (aws_access_key_id, aws_secret_access_key,
#      aws_region, aws_state_bucket)
# ============================================================

on:
  workflow_dispatch:
    inputs:

      # Common (3 inputs)
      provider:
        description: "Cloud provider to use"
        required: true
        default: "gcp"
        type: choice
        options:
          - gcp
          - digitalocean
          - azure
          - aws

      action:
        description: "Apply = create cluster | Destroy = delete cluster"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

      cluster_name:
        description: "Cluster name (GKE, DOKS, AKS, or EKS)"
        required: false
        default: "crack-detection-cluster"
        type: string

      # ---- GCP inputs (fill these if provider = gcp) (7 inputs) ----
      gcp_account_name:
        description: "[GCP] Account Name for logging / verification"
        required: false
        default: "maheshrajannan"
        type: choice
        options:
          - maheshrajannan
          - empowerinnovate
          - custom

      gcp_custom_account_name:
        description: "[GCP] Custom Account Name (used only if Account Name above is set to 'custom')"
        required: false
        type: string

      gcp_project_id:
        description: "[GCP] Your GCP project ID  e.g. my-project-123"
        required: false
        type: string

      gcp_sa_key_base64:
        description: "[GCP] SA key base64 single-line. Linux: base64 -w 0 key.json | Mac: base64 -i key.json | tr -d '\\n'"
        required: false
        type: string

      gcp_backend_bucket:
        description: "[GCP] GCS bucket name for Terraform backend"
        required: false
        default: "crack-detection-terraform"
        type: choice
        options:
          - crack-detection-terraform
          - crack-detection-terraform-1
          - custom

      gcp_custom_backend_bucket:
        description: "[GCP] Custom GCS bucket name (used only if GCS bucket name above is set to 'custom')"
        required: false
        type: string

      gcp_cluster_zone:
        description: "[GCP] Zone for the GKE cluster  e.g. us-central1-a"
        required: false
        default: "us-central1-a"
        type: string

      # ---- DigitalOcean inputs (fill these if provider = digitalocean) (4 inputs) ----
      do_token:
        description: "[DO] DigitalOcean API token"
        required: false
        type: string

      do_access_key:
        description: "[DO] Spaces access key (Terraform backend)"
        required: false
        type: string

      do_secret_key:
        description: "[DO] Spaces secret key (Terraform backend)"
        required: false
        type: string

      do_cluster_region:
        description: "[DO] Region for the DOKS cluster  e.g. sfo3 (nyc3 has no capacity)"
        required: false
        default: "sfo3"
        type: string

      # ---- Azure inputs (fill these if provider = azure) (7 inputs) ----
      azure_subscription_id:
        description: "[Azure] Subscription ID"
        required: false
        type: string

      azure_tenant_id:
        description: "[Azure] Tenant ID (Directory ID)"
        required: false
        type: string

      azure_client_id:
        description: "[Azure] Service Principal Client ID (App ID)"
        required: false
        type: string

      azure_client_secret:
        description: "[Azure] Service Principal Client Secret"
        required: false
        type: string

      azure_resource_group:
        description: "[Azure] Resource Group for AKS (leave blank to auto-create '<cluster_name>-rg')"
        required: false
        type: string

      azure_storage_account:
        description: "[Azure] Storage Account name for Terraform backend"
        required: false
        type: string

      azure_location:
        description: "[Azure] Region for the AKS cluster  e.g. eastus"
        required: false
        default: "eastus"
        type: string

      # ---- AWS inputs (fill these if provider = aws) (4 inputs, total = 25 = GitHub max) ----
      aws_access_key_id:
        description: "[AWS] Deployer IAM user Access Key ID"
        required: false
        type: string

      aws_secret_access_key:
        description: "[AWS] Deployer IAM user Secret Access Key"
        required: false
        type: string

      aws_region:
        description: "[AWS] Region for the EKS cluster  e.g. us-east-1"
        required: false
        default: "us-east-1"
        type: string

      aws_state_bucket:
        description: "[AWS] S3 bucket name for Terraform backend"
        required: false
        default: "crack-detection-tfstate"
        type: string

jobs:
  provision-cluster:
    name: Provision Kubernetes Cluster
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print input parameters
        run: |
          RAW_KEY="${{ github.event.inputs.gcp_sa_key_base64 }}"
          if [ -n "$RAW_KEY" ]; then
            KEY_15="${RAW_KEY:0:15}"
            SPACED_15=$(echo "$KEY_15" | sed 's/./& /g')
            TOKEN_INFO="Token preview (spaced): $SPACED_15"
          else
            TOKEN_INFO="NOT provided"
          fi

          RAW_AZ_SECRET="${{ github.event.inputs.azure_client_secret }}"
          if [ -n "$RAW_AZ_SECRET" ]; then
            AZ_SEC_15="${RAW_AZ_SECRET:0:15}"
            SPACED_AZ_15=$(echo "$AZ_SEC_15" | sed 's/./& /g')
            AZ_SECRET_INFO="Secret preview (spaced): $SPACED_AZ_15"
          else
            AZ_SECRET_INFO="NOT provided (will check secrets)"
          fi

          echo "================================================"
          echo "  Pipeline Input Parameters"
          echo "================================================"
          echo "  provider                : ${{ github.event.inputs.provider }}"
          echo "  action                  : ${{ github.event.inputs.action }}"
          echo "  cluster_name            : ${{ github.event.inputs.cluster_name }}"
          echo "  gcp_project_id          : ${{ github.event.inputs.gcp_project_id }}"
          echo "  gcp_cluster_zone        : ${{ github.event.inputs.gcp_cluster_zone }}"
          echo "  do_cluster_region       : ${{ github.event.inputs.do_cluster_region }}"
          echo "  do_token                : ${{ github.event.inputs.do_token != '' && 'provided' || 'NOT provided' }}"
          echo "  do_access_key           : ${{ github.event.inputs.do_access_key != '' && 'provided' || 'NOT provided' }}"
          echo "  do_secret_key           : ${{ github.event.inputs.do_secret_key != '' && 'provided' || 'NOT provided' }}"
          echo "  gcp_sa_key_base64       : $TOKEN_INFO"
          echo "  gcp_backend_bucket      : ${{ github.event.inputs.gcp_backend_bucket }}"
          echo "  azure_subscription_id   : ${{ github.event.inputs.azure_subscription_id }}"
          echo "  azure_tenant_id         : ${{ github.event.inputs.azure_tenant_id }}"
          echo "  azure_client_id         : ${{ github.event.inputs.azure_client_id != '' && 'provided' || 'NOT provided' }}"
          echo "  azure_client_secret     : $AZ_SECRET_INFO"
          echo "  azure_resource_group    : ${{ github.event.inputs.azure_resource_group }}"
          echo "  azure_storage_account   : ${{ github.event.inputs.azure_storage_account }}"
          echo "  azure_location          : ${{ github.event.inputs.azure_location }}"
          echo "  aws_region              : ${{ github.event.inputs.aws_region }}"
          echo "  aws_state_bucket        : ${{ github.event.inputs.aws_state_bucket }}"
          echo "  aws_access_key_id       : ${{ github.event.inputs.aws_access_key_id != '' && 'provided' || 'NOT provided' }}"
          echo "  aws_secret_access_key   : ${{ github.event.inputs.aws_secret_access_key != '' && 'provided' || 'NOT provided' }}"
          echo "================================================"

      - name: Print Account & Target Info (GCP)
        if: ${{ github.event.inputs.provider == 'gcp' }}
        run: |
          ACCT="${{ github.event.inputs.gcp_account_name }}"
          if [ "$ACCT" = "custom" ]; then
            ACCT="${{ github.event.inputs.gcp_custom_account_name }}"
          fi
          if [ -z "$ACCT" ]; then
            ACCT="maheshrajannan"
          fi
          RAW_KEY="${{ github.event.inputs.gcp_sa_key_base64 }}"
          if [ -n "$RAW_KEY" ]; then
            KEY_15="${RAW_KEY:0:15}"
            SPACED_15=$(echo "$KEY_15" | sed 's/./& /g')
          else
            SPACED_15="NOT provided"
          fi
          echo "======================================================"
          echo " Target GCP Account Name: $ACCT"
          echo " GCP Project ID:          ${{ github.event.inputs.gcp_project_id }}"
          echo " SA Key Preview (15 chars): $SPACED_15"
          echo "======================================================"

      - name: Print Account & Target Info (Azure)
        if: ${{ github.event.inputs.provider == 'azure' }}
        run: |
          SUB_ID="${{ github.event.inputs.azure_subscription_id }}"
          echo "======================================================"
          echo " Azure Subscription ID:      ${SUB_ID:0:8}...${SUB_ID: -4}"
          echo " Azure Tenant ID:            ${{ github.event.inputs.azure_tenant_id }}"
          echo " Azure Location:             ${{ github.event.inputs.azure_location }}"
          echo " Cluster Name:               ${{ github.event.inputs.cluster_name }}"
          echo " Storage Account (State):    ${{ github.event.inputs.azure_storage_account }}"
          echo "======================================================"

      - name: Print Account & Target Info (AWS)
        if: ${{ github.event.inputs.provider == 'aws' }}
        run: |
          echo "======================================================"
          echo " AWS Region:                 ${{ github.event.inputs.aws_region }}"
          echo " Cluster Name:               ${{ github.event.inputs.cluster_name }}"
          echo " S3 Bucket (State):          ${{ github.event.inputs.aws_state_bucket }}"
          echo " DynamoDB Lock Table:        crack-detection-tflock"
          echo "======================================================"

      - name: Validate required inputs
        run: |
          PROVIDER="${{ github.event.inputs.provider }}"
          if [[ "$PROVIDER" == "gcp" ]]; then
            [[ -z "${{ github.event.inputs.gcp_project_id }}" ]]  && echo "ERROR: gcp_project_id is required"  && exit 1
            [[ -z "${{ github.event.inputs.gcp_sa_key_base64 }}" ]] && echo "ERROR: gcp_sa_key_base64 is required" && exit 1
            [[ -z "${{ github.event.inputs.gcp_backend_bucket }}" ]] && echo "ERROR: gcp_backend_bucket is required" && exit 1
            echo "GCP inputs validated."
          fi
          if [[ "$PROVIDER" == "digitalocean" ]]; then
            [[ -z "${{ github.event.inputs.do_token }}" ]] && echo "ERROR: do_token is required" && exit 1
            echo "DigitalOcean inputs validated."
          fi
          if [[ "$PROVIDER" == "azure" ]]; then
            [[ -z "${{ github.event.inputs.azure_subscription_id }}" ]] && echo "ERROR: azure_subscription_id is required" && exit 1
            [[ -z "${{ github.event.inputs.azure_tenant_id }}" ]]       && echo "ERROR: azure_tenant_id is required" && exit 1
            [[ -z "${{ github.event.inputs.azure_client_id }}" && -z "${{ secrets.AZURE_CLIENT_ID }}" ]] && echo "ERROR: azure_client_id is required" && exit 1
            [[ -z "${{ github.event.inputs.azure_client_secret }}" && -z "${{ secrets.AZURE_CLIENT_SECRET }}" ]] && echo "ERROR: azure_client_secret is required" && exit 1
            [[ -z "${{ github.event.inputs.azure_storage_account }}" ]] && echo "ERROR: azure_storage_account is required" && exit 1
            echo "Azure inputs validated."
          fi
          if [[ "$PROVIDER" == "aws" ]]; then
            [[ -z "${{ github.event.inputs.aws_access_key_id }}" ]]     && echo "ERROR: aws_access_key_id is required" && exit 1
            [[ -z "${{ github.event.inputs.aws_secret_access_key }}" ]] && echo "ERROR: aws_secret_access_key is required" && exit 1
            [[ -z "${{ github.event.inputs.aws_region }}" ]]       && echo "ERROR: aws_region is required" && exit 1
            [[ -z "${{ github.event.inputs.aws_state_bucket }}" ]] && echo "ERROR: aws_state_bucket is required" && exit 1
            echo "AWS inputs validated."
          fi

      - name: Set working directory
        id: setdir
        run: |
          if [[ "${{ github.event.inputs.provider }}" == "gcp" ]]; then
            echo "dir=./gcp-cluster" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.provider }}" == "digitalocean" ]]; then
            echo "dir=./digitalocean-cluster" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.provider }}" == "azure" ]]; then
            echo "dir=./azure-cluster" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.provider }}" == "aws" ]]; then
            echo "dir=./aws-cluster" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # ==== GCP Auth ====
      - name: Decode and authenticate to GCP
        if: ${{ github.event.inputs.provider == 'gcp' }}
        env:
          GCP_SA_KEY_BASE64: ${{ github.event.inputs.gcp_sa_key_base64 }}
        run: |
          if [ -n "$GCP_SA_KEY_BASE64" ]; then
            KEY_15="${GCP_SA_KEY_BASE64:0:15}"
            SPACED_15=$(echo "$KEY_15" | sed 's/./& /g')
            echo "First 15 characters of provided SA key token (raw): ${KEY_15}"
            echo "First 15 characters of provided SA key token (spaced): ${SPACED_15}"
          else
            echo "No custom base64 SA key provided in input. Using default secrets."
          fi
          echo "$GCP_SA_KEY_BASE64" | tr -d '\n' | base64 -d > $HOME/gcp-key.json
          gcloud auth activate-service-account --key-file=$HOME/gcp-key.json
          gcloud config set project ${{ github.event.inputs.gcp_project_id }}
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json" >> $GITHUB_ENV

      - name: Install gke-gcloud-auth-plugin
        if: ${{ github.event.inputs.provider == 'gcp' }}
        run: |
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
          sudo apt-get update -y
          sudo apt-get install -y google-cloud-cli-gke-gcloud-auth-plugin

      # ==== Azure Auth ====
      - name: Authenticate to Azure
        if: ${{ github.event.inputs.provider == 'azure' }}
        env:
          INPUT_CLIENT_ID: ${{ github.event.inputs.azure_client_id }}
          INPUT_CLIENT_SECRET: ${{ github.event.inputs.azure_client_secret }}
          SECRET_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SECRET_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TENANT_ID: ${{ github.event.inputs.azure_tenant_id }}
          SUBSCRIPTION_ID: ${{ github.event.inputs.azure_subscription_id }}
        run: |
          CLIENT_ID="${INPUT_CLIENT_ID:-$SECRET_CLIENT_ID}"
          CLIENT_SECRET="${INPUT_CLIENT_SECRET:-$SECRET_CLIENT_SECRET}"

          echo "::add-mask::$CLIENT_SECRET"
          echo "ARM_CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$CLIENT_SECRET" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$TENANT_ID" >> $GITHUB_ENV

          az login --service-principal -u "$CLIENT_ID" -p "$CLIENT_SECRET" --tenant "$TENANT_ID"
          az account set --subscription "$SUBSCRIPTION_ID"
          echo "Azure CLI authenticated for Subscription: $SUBSCRIPTION_ID"

      # ==== AWS Auth ====
      - name: Authenticate to AWS
        if: ${{ github.event.inputs.provider == 'aws' }}
        env:
          ACCESS_KEY_ID: ${{ github.event.inputs.aws_access_key_id }}
          SECRET_ACCESS_KEY: ${{ github.event.inputs.aws_secret_access_key }}
          REGION: ${{ github.event.inputs.aws_region }}
        run: |
          echo "::add-mask::$SECRET_ACCESS_KEY"
          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_REGION=$REGION" >> $GITHUB_ENV

          export AWS_ACCESS_KEY_ID="$ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$SECRET_ACCESS_KEY" AWS_REGION="$REGION"
          CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "AWS CLI authenticated as: $CALLER_ARN"

      # ==== Terraform Init ====
      - name: Terraform Init (GCP)
        if: ${{ github.event.inputs.provider == 'gcp' }}
        run: |
          BUCKET="${{ github.event.inputs.gcp_backend_bucket }}"
          if [ "$BUCKET" = "custom" ]; then
            BUCKET="${{ github.event.inputs.gcp_custom_backend_bucket }}"
          fi
          if [ -z "$BUCKET" ]; then
            BUCKET="crack-detection-terraform"
          fi
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          if [ -z "$CLUSTER_NAME" ]; then
            CLUSTER_NAME="crack-detection-cluster"
          fi
          echo "Initializing Terraform GCS backend with bucket=$BUCKET and prefix=gke/$CLUSTER_NAME"
          terraform init -input=false -backend-config="bucket=$BUCKET" -backend-config="prefix=gke/$CLUSTER_NAME"
        working-directory: ${{ steps.setdir.outputs.dir }}

      - name: Terraform Init (DigitalOcean)
        if: ${{ github.event.inputs.provider == 'digitalocean' }}
        env:
          TF_VAR_digitalocean_token: ${{ github.event.inputs.do_token }}
          DO_TOKEN: ${{ github.event.inputs.do_token }}
          AWS_ACCESS_KEY_ID: ${{ github.event.inputs.do_access_key }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event.inputs.do_secret_key }}
          BUCKET_PREFIX: terraform-crack-detection
          SPACES_REGIONS: "nyc3 sfo3 sfo2 ams3 fra1 sgp1 syd1 blr1 lon1 tor1 atl1"
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          if [ -z "$CLUSTER_NAME" ]; then
            CLUSTER_NAME="crack-detection-cluster"
          fi

          # Spaces bucket names are unique per region, so a fixed name such as
          # 'terraform-crack-detection' may already belong to another account. Find the
          # state bucket among the buckets this key can see ('<prefix>' or '<prefix>-*'),
          # in whichever region it lives, instead of assuming a fixed name in nyc3.
          list_buckets() {
            aws s3api list-buckets --region us-east-1 --endpoint-url "https://$1.digitaloceanspaces.com" \
              --query 'Buckets[].Name' --output text 2>/dev/null | tr '\t' '\n' | grep -v '^None$' || true
          }
          BUCKET="" BUCKET_REGION=""
          echo "::group::Buckets visible to the Spaces key"
          for R in $SPACES_REGIONS; do
            NAMES=$(list_buckets "$R")
            echo "  $R: $(echo $NAMES)"
            [[ -n "$BUCKET" ]] && continue
            # Prefer the exact prefix name, then the first '<prefix>-*' bucket.
            MATCH=$(echo "$NAMES" | grep -x "$BUCKET_PREFIX" || echo "$NAMES" | grep -E "^${BUCKET_PREFIX}-" | sort | head -n 1 || true)
            if [[ -n "$MATCH" ]]; then
              BUCKET="$MATCH" BUCKET_REGION="$R"
            fi
          done
          echo "::endgroup::"

          if [[ -z "$BUCKET" ]]; then
            # None yet: create one whose name is unique to this DO account
            # (suffix derived from the account UUID, so reruns pick the same name).
            BUCKET_REGION="${{ github.event.inputs.do_cluster_region }}"
            BUCKET_REGION="${BUCKET_REGION:-sfo3}"
            [[ " $SPACES_REGIONS " == *" $BUCKET_REGION "* ]] || BUCKET_REGION="nyc3"
            ACCOUNT_UUID=$(curl -sf -H "Authorization: Bearer $DO_TOKEN" https://api.digitalocean.com/v2/account | jq -r '.account.uuid // empty' || true)
            SUFFIX=$(printf '%s' "${ACCOUNT_UUID:-$AWS_ACCESS_KEY_ID}" | sha256sum | cut -c1-8)
            BUCKET="${BUCKET_PREFIX}-${SUFFIX}"
            echo "No '$BUCKET_PREFIX*' bucket visible to the key - creating '$BUCKET' in $BUCKET_REGION..."
            if ! ERR=$(aws s3api create-bucket --bucket "$BUCKET" --region us-east-1 \
                 --endpoint-url "https://$BUCKET_REGION.digitaloceanspaces.com" 2>&1); then
              echo "::error::Could not create Spaces bucket '$BUCKET' in $BUCKET_REGION: $ERR"
              echo "::error::Create a bucket named '$BUCKET_PREFIX-<something-unique>' in the DO console (or use a full-access Spaces key) and rerun."
              exit 1
            fi
          fi
          echo "Terraform state bucket: $BUCKET ($BUCKET_REGION)"

          cat > backend.hcl <<HCL
          bucket    = "$BUCKET"
          key       = "DO-cluster/${CLUSTER_NAME}.tfstate"
          endpoints = { s3 = "https://${BUCKET_REGION}.digitaloceanspaces.com" }
          HCL

          echo "Initializing Terraform DO backend with key=DO-cluster/${CLUSTER_NAME}.tfstate"
          for attempt in 1 2 3; do
            echo "Terraform init attempt $attempt of 3..."
            if terraform init -input=false -reconfigure \
              -backend-config=backend.hcl \
              -backend-config="access_key=$AWS_ACCESS_KEY_ID" \
              -backend-config="secret_key=$AWS_SECRET_ACCESS_KEY" 2>&1 | tee init.log; [[ ${PIPESTATUS[0]} -eq 0 ]]; then
              break
            fi
            # Auth/permission errors won't fix themselves, so don't retry them.
            if grep -qE "AccessDenied|InvalidAccessKeyId|SignatureDoesNotMatch|StatusCode: 403" init.log; then
              echo "::error::Spaces rejected the do_access_key/do_secret_key for bucket '$BUCKET' ($BUCKET_REGION). If it is a limited-access key, give it read/write on that bucket."
              exit 1
            fi
            if [[ $attempt -lt 3 ]]; then
              echo "Init failed, retrying in 30s..."
              sleep 30
            else
              echo "Terraform init failed after 3 attempts."
              exit 1
            fi
          done
        working-directory: ${{ steps.setdir.outputs.dir }}

      - name: Terraform Init (Azure)
        if: ${{ github.event.inputs.provider == 'azure' }}
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          if [ -z "$CLUSTER_NAME" ]; then
            CLUSTER_NAME="crack-detection-cluster"
          fi
          STORAGE_ACCOUNT="${{ github.event.inputs.azure_storage_account }}"
          CONTAINER="tfstate"
          LOCATION="${{ github.event.inputs.azure_location }}"
          if [ -z "$LOCATION" ]; then
            LOCATION="eastus"
          fi

          # A disabled subscription is read-only: the state storage keys can't even be listed
          # (409 ReadOnlyDisabledSubscription), so fail here with the reason instead of in init.
          SUB=$(az account show --query "{id:id, name:name, state:state}" -o json)
          SUB_ID=$(echo "$SUB" | jq -r '.id')
          SUB_STATE=$(echo "$SUB" | jq -r '.state')
          echo "Azure subscription: $(echo "$SUB" | jq -r '.name') ($SUB_ID), state: $SUB_STATE"
          # 'Warned' (billing issue) can already be read-only too, so only 'Enabled' is allowed.
          if [ "$SUB_STATE" != "Enabled" ]; then
            echo "::error::Azure subscription '$SUB_ID' is '$SUB_STATE', so it is read-only and nothing can be created or changed. This is usually an expired free trial/credit, a spending limit, or a billing problem. Re-enable it in the Azure portal (Subscriptions -> $SUB_ID -> Reactivate / remove spending limit, or upgrade to Pay-As-You-Go), or rerun with AZURE_CREDENTIALS for an active subscription."
            exit 1
          fi

          # Discover or configure the storage account resource group
          SA_RG=$(az storage account list --query "[?name=='$STORAGE_ACCOUNT'].resourceGroup" -o tsv 2>/dev/null || echo "")
          if [ -z "$SA_RG" ]; then
            SA_RG="${{ github.event.inputs.azure_resource_group }}"
          fi
          if [ -z "$SA_RG" ]; then
            SA_RG="crack-detection-tfstate-rg"
          fi

          # Ensure the backend Resource Group exists
          if ! az group show --name "$SA_RG" &>/dev/null; then
            echo "Resource Group '$SA_RG' does not exist. Creating in $LOCATION..."
            az group create --name "$SA_RG" --location "$LOCATION" --tags Environment=production Project=crack-detection
          fi

          # Ensure the backend Storage Account exists
          if ! az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$SA_RG" &>/dev/null; then
            echo "Storage Account '$STORAGE_ACCOUNT' does not exist. Creating in $SA_RG ($LOCATION)..."
            az storage account create \
              --name "$STORAGE_ACCOUNT" \
              --resource-group "$SA_RG" \
              --location "$LOCATION" \
              --sku Standard_LRS \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false
          fi

          # Ensure the Blob Container exists
          echo "Ensuring backend blob container '$CONTAINER' exists in storage account '$STORAGE_ACCOUNT'..."
          az storage container create \
            --name "$CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login 2>/dev/null || true

          # The next step must never let Terraform manage (and so possibly destroy) this group.
          echo "TFSTATE_RG=$SA_RG" >> "$GITHUB_ENV"

          echo "Initializing Terraform Azure backend:"
          echo "  resource_group_name  = $SA_RG"
          echo "  storage_account_name = $STORAGE_ACCOUNT"
          echo "  container_name       = $CONTAINER"
          echo "  key                  = aks/${CLUSTER_NAME}.tfstate"

          if terraform init -input=false \
            -backend-config="resource_group_name=$SA_RG" \
            -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
            -backend-config="container_name=$CONTAINER" \
            -backend-config="key=aks/${CLUSTER_NAME}.tfstate" 2>&1 | tee init.log; [[ ${PIPESTATUS[0]} -ne 0 ]]; then
            # The state can lag behind billing, so the subscription may report 'Enabled' yet be read-only.
            if grep -q "ReadOnlyDisabledSubscription" init.log; then
              echo "::error::Azure subscription '$SUB_ID' is disabled/read-only (reported state: '$SUB_STATE'). Resolve the billing issue and re-enable it in the Azure portal (Subscriptions -> $SUB_ID -> Reactivate / remove spending limit, or upgrade to Pay-As-You-Go), or rerun with AZURE_CREDENTIALS for an active subscription."
            fi
            exit 1
          fi
        working-directory: ${{ steps.setdir.outputs.dir }}

      - name: Terraform Init (AWS)
        if: ${{ github.event.inputs.provider == 'aws' }}
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          if [ -z "$CLUSTER_NAME" ]; then
            CLUSTER_NAME="crack-detection-cluster"
          fi
          BUCKET="${{ github.event.inputs.aws_state_bucket }}"
          LOCK_TABLE="crack-detection-tflock"
          REGION="${{ github.event.inputs.aws_region }}"

          # Ensure the backend S3 bucket exists
          if ! aws s3api head-bucket --bucket "$BUCKET" &>/dev/null; then
            echo "S3 bucket '$BUCKET' does not exist. Creating in $REGION..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          BUCKET_REGION=$(aws s3api get-bucket-location --bucket "$BUCKET" --query LocationConstraint --output text)
          if [ "$BUCKET_REGION" = "None" ] || [ -z "$BUCKET_REGION" ]; then
            BUCKET_REGION="us-east-1"
          fi

          # Ensure the DynamoDB lock table exists (in the bucket's region)
          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$BUCKET_REGION" &>/dev/null; then
            echo "DynamoDB table '$LOCK_TABLE' does not exist. Creating in $BUCKET_REGION..."
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$BUCKET_REGION" >/dev/null
            aws dynamodb wait table-exists --table-name "$LOCK_TABLE" --region "$BUCKET_REGION"
          fi

          echo "Initializing Terraform S3 backend:"
          echo "  bucket         = $BUCKET"
          echo "  region         = $BUCKET_REGION"
          echo "  dynamodb_table = $LOCK_TABLE"
          echo "  key            = eks/${CLUSTER_NAME}.tfstate"

          terraform init -input=false \
            -backend-config="bucket=$BUCKET" \
            -backend-config="region=$BUCKET_REGION" \
            -backend-config="dynamodb_table=$LOCK_TABLE" \
            -backend-config="encrypt=true" \
            -backend-config="key=eks/${CLUSTER_NAME}.tfstate"
        working-directory: ${{ steps.setdir.outputs.dir }}

      # ==== Azure: decide whether Terraform creates the AKS resource group or reuses one ====
      # Creating a group that already exists fails with "a resource with the ID ... already
      # exists". So: keep managing a group Terraform created earlier (it is in state); reuse an
      # existing group as read-only data (destroy then leaves it alone); create it otherwise.
      # The Terraform state resource group is never managed, so destroy can't wipe the state.
      - name: Resolve AKS resource group (Azure)
        if: ${{ github.event.inputs.provider == 'azure' }}
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          CLUSTER_NAME="${CLUSTER_NAME:-crack-detection-cluster}"
          RG="${{ github.event.inputs.azure_resource_group }}"
          RG="${RG:-${CLUSTER_NAME}-rg}"

          IN_STATE=""
          terraform state list 2>/dev/null | grep -qx 'azurerm_resource_group.cluster\[0\]' && IN_STATE=1
          if [[ "$RG" == "$TFSTATE_RG" ]]; then
            echo "::warning::'$RG' holds the Terraform state storage account. The cluster is placed in it as an existing group, but Terraform will not manage or delete it. Leave azure_resource_group blank to give the cluster its own '${CLUSTER_NAME}-rg'."
            if [[ -n "$IN_STATE" ]]; then
              echo "Removing '$RG' from Terraform state so destroy cannot delete it (the group itself is untouched)."
              terraform state rm 'azurerm_resource_group.cluster[0]'
              IN_STATE=""
            fi
            CREATE=false
          elif [[ -n "$IN_STATE" ]]; then
            echo "Resource group '$RG' is managed by Terraform (in state)."
            CREATE=true
          elif [[ "$(az group exists --name "$RG")" == "true" ]]; then
            echo "Resource group '$RG' already exists - using it as is (Terraform will not create or delete it)."
            CREATE=false
          else
            echo "Resource group '$RG' does not exist - Terraform will create it."
            CREATE=true
          fi
          echo "TF_VAR_resource_group_name=$RG" >> "$GITHUB_ENV"
          echo "TF_VAR_create_resource_group=$CREATE" >> "$GITHUB_ENV"
        working-directory: ${{ steps.setdir.outputs.dir }}

      # ==== Terraform Plan / Apply / Destroy ====
      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ steps.setdir.outputs.dir }}

      - name: Terraform Plan
        env:
          TF_VAR_digitalocean_token: ${{ github.event.inputs.do_token }}
        run: |
          if [[ "${{ github.event.inputs.provider }}" == "gcp" ]]; then
            export TF_VAR_project_id="${{ github.event.inputs.gcp_project_id }}"
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_zone="${{ github.event.inputs.gcp_cluster_zone }}"
          elif [[ "${{ github.event.inputs.provider }}" == "digitalocean" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_region="${{ github.event.inputs.do_cluster_region }}"
          elif [[ "${{ github.event.inputs.provider }}" == "azure" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_location="${{ github.event.inputs.azure_location }}"
          elif [[ "${{ github.event.inputs.provider }}" == "aws" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_region="${{ github.event.inputs.aws_region }}"
          fi
          
          if [[ "${{ github.event.inputs.action }}" == "apply" ]]; then
            terraform plan -out=tfplan
          else
            terraform plan -destroy -out=tfplan
          fi
        working-directory: ${{ steps.setdir.outputs.dir }}

      - name: Check DigitalOcean account status
        if: ${{ github.event.inputs.action == 'apply' && github.event.inputs.provider == 'digitalocean' }}
        env:
          DO_TOKEN: ${{ github.event.inputs.do_token }}
        run: |
          ACCOUNT=$(curl -sf -H "Authorization: Bearer $DO_TOKEN" https://api.digitalocean.com/v2/account) \
            || { echo "::error::Could not query the DigitalOcean account API, check do_token"; exit 1; }
          echo "$ACCOUNT" | jq '.account | {status, status_message, email_verified, droplet_limit, volume_limit}'
          STATUS=$(echo "$ACCOUNT" | jq -r '.account.status')
          LIMIT=$(echo "$ACCOUNT" | jq -r '.account.droplet_limit')
          DROPLETS=$(curl -sf -H "Authorization: Bearer $DO_TOKEN" "https://api.digitalocean.com/v2/droplets?per_page=1" | jq -r '.meta.total')
          echo "Droplets in use: $DROPLETS / $LIMIT"
          if [[ "$STATUS" != "active" ]]; then
            echo "::error::DigitalOcean account status is '$STATUS': $(echo "$ACCOUNT" | jq -r '.account.status_message'). Resolve this in the DO dashboard before creating a cluster."
            exit 1
          fi
          if [[ "$(echo "$ACCOUNT" | jq -r '.account.email_verified')" != "true" ]]; then
            echo "::warning::DigitalOcean account email is not verified; cluster creation may be rejected."
          fi
          if (( DROPLETS >= LIMIT )); then
            echo "::error::Droplet limit reached ($DROPLETS/$LIMIT). Request a limit increase in DO Settings -> Account limits."
            exit 1
          fi

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        env:
          TF_VAR_digitalocean_token: ${{ github.event.inputs.do_token }}
        run: |
          if [[ "${{ github.event.inputs.provider }}" == "gcp" ]]; then
            export TF_VAR_project_id="${{ github.event.inputs.gcp_project_id }}"
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_zone="${{ github.event.inputs.gcp_cluster_zone }}"
          elif [[ "${{ github.event.inputs.provider }}" == "digitalocean" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_region="${{ github.event.inputs.do_cluster_region }}"
          elif [[ "${{ github.event.inputs.provider }}" == "azure" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_location="${{ github.event.inputs.azure_location }}"
          elif [[ "${{ github.event.inputs.provider }}" == "aws" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_region="${{ github.event.inputs.aws_region }}"
          fi

          if [[ "${{ github.event.inputs.provider }}" != "digitalocean" ]]; then
            terraform apply -auto-approve tfplan
            exit 0
          fi

          # DigitalOcean: DOKS often returns 422 "region has insufficient capacity".
          # A failed create leaves nothing in state, so retry in other regions.
          echo "::group::Apply in $TF_VAR_region"
          if terraform apply -auto-approve tfplan 2>&1 | tee apply.log; [[ ${PIPESTATUS[0]} -eq 0 ]]; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          if ! grep -q "insufficient capacity" apply.log; then
            exit 1
          fi

          FALLBACK_REGIONS="sfo3 nyc1 tor1 ams3 fra1 lon1 blr1 sgp1 syd1"
          for REGION in $FALLBACK_REGIONS; do
            [[ "$REGION" == "$TF_VAR_region" ]] && continue
            echo "No DOKS capacity in $TF_VAR_region (expected, see collapsed log above), retrying in $REGION..."
            export TF_VAR_region="$REGION"
            echo "::group::Apply in $REGION"
            if terraform apply -auto-approve 2>&1 | tee apply.log; [[ ${PIPESTATUS[0]} -eq 0 ]]; then
              echo "::endgroup::"
              echo "::notice::DOKS cluster created in region $REGION (requested region had no capacity)"
              exit 0
            fi
            echo "::endgroup::"
            if ! grep -q "insufficient capacity" apply.log; then
              exit 1
            fi
          done

          echo "::error::Every region returned 'insufficient capacity'. This is an account restriction, not a region one: check the 'Check DigitalOcean account status' step, verify billing/payment method, and open a DigitalOcean support ticket to enable Kubernetes or raise limits."
          exit 1
        working-directory: ${{ steps.setdir.outputs.dir }}

      # ==== Pre-destroy: clean up DO LoadBalancers and Volumes via DO API (no kubectl needed) ====
      - name: Install doctl (DO pre-destroy cleanup)
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'digitalocean' }}
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.97.0/doctl-1.97.0-linux-amd64.tar.gz | tar -xz
          sudo mv doctl /usr/local/bin/
          doctl auth init -t ${{ github.event.inputs.do_token }}

      - name: Delete all DO LoadBalancers via API (DigitalOcean pre-destroy)
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'digitalocean' }}
        run: |
          echo "Fetching all LoadBalancers in your DO account..."
          LB_IDS=$(doctl compute load-balancer list --format ID --no-header 2>/dev/null || true)
          if [[ -z "$LB_IDS" ]]; then
            echo "No LoadBalancers found, skipping."
          else
            echo "Deleting LoadBalancers: $LB_IDS"
            for LB_ID in $LB_IDS; do
              echo "Deleting LoadBalancer $LB_ID..."
              doctl compute load-balancer delete "$LB_ID" --force
            done
            echo "⏳ Waiting 20s for DO to release LoadBalancers..."
            sleep 20
            echo "✅ All LoadBalancers deleted"
          fi

      - name: Delete all DO Block Storage Volumes via API (DigitalOcean pre-destroy)
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'digitalocean' }}
        run: |
          echo "Fetching all Block Storage Volumes in your DO account..."
          VOL_IDS=$(doctl compute volume list --format ID --no-header 2>/dev/null || true)
          if [[ -z "$VOL_IDS" ]]; then
            echo "No Volumes found, skipping."
          else
            echo "Deleting Volumes: $VOL_IDS"
            for VOL_ID in $VOL_IDS; do
              echo "Deleting Volume $VOL_ID..."
              doctl compute volume delete "$VOL_ID" --force || true
            done
            echo "✅ All Volumes deleted"
          fi

      # ==== Pre-destroy: clean up GCP LoadBalancers and NEGs via Kubernetes controllers & gcloud ====
      - name: GKE Pre-Destroy Cleanup (GCP)
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'gcp' }}
        run: |
          echo "Connecting to GKE cluster..."
          gcloud container clusters get-credentials "${{ github.event.inputs.cluster_name }}" --zone "${{ github.event.inputs.gcp_cluster_zone }}" --project "${{ github.event.inputs.gcp_project_id }}" || true
          
          echo "Uninstalling helm charts and deleting ingresses/services to trigger resource cleanup..."
          helm list -A -q | xargs -I {} helm uninstall {} || true
          kubectl delete ingress --all --all-namespaces || true
          kubectl delete svc --all --all-namespaces --field-selector metadata.name!=kubernetes || true
          
          echo "⏳ Waiting 60s for GCP Load Balancers and NEGs to be cleanly deleted by controllers..."
          sleep 60
          
          echo "Deleting any leftover NEGs..."
          ZONE="${{ github.event.inputs.gcp_cluster_zone }}"
          PROJECT="${{ github.event.inputs.gcp_project_id }}"
          NEGS=$(gcloud compute network-endpoint-groups list --zone="$ZONE" --project="$PROJECT" --format="value(name)" 2>/dev/null || true)
          if [[ -n "$NEGS" ]]; then
            echo "Leftover NEGs found: $NEGS"
            for NEG in $NEGS; do
              # Try to delete associated backend service first if it exists
              gcloud compute backend-services delete "$NEG" --global --quiet --project="$PROJECT" || true
              gcloud compute network-endpoint-groups delete "$NEG" --zone="$ZONE" --quiet --project="$PROJECT" || true
            done
          fi

      # ==== Pre-destroy: clean up Azure LoadBalancers and Services ====
      - name: AKS Pre-Destroy Cleanup (Azure)
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'azure' }}
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          RG="$TF_VAR_resource_group_name"

          echo "Connecting to AKS cluster $CLUSTER_NAME in $RG..."
          az aks get-credentials --resource-group "$RG" --name "$CLUSTER_NAME" --overwrite-existing || true

          echo "Uninstalling helm charts and deleting ingresses/services to release Azure Load Balancers and Public IPs..."
          helm list -A -q | xargs -I {} helm uninstall {} || true
          kubectl delete ingress --all --all-namespaces || true
          kubectl delete svc --all --all-namespaces --field-selector metadata.name!=kubernetes || true

          echo "⏳ Waiting 30s for Azure Load Balancers and Public IPs to be cleanly released..."
          sleep 30

      # ==== Pre-destroy: clean up AWS ELBs and EBS volumes created by Kubernetes ====
      - name: EKS Pre-Destroy Cleanup (AWS)
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'aws' }}
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          REGION="${{ github.event.inputs.aws_region }}"

          echo "Connecting to EKS cluster $CLUSTER_NAME in $REGION..."
          aws eks update-kubeconfig --region "$REGION" --name "$CLUSTER_NAME" || true

          echo "Uninstalling helm charts and deleting ingresses/services/PVCs to release ELBs and EBS volumes..."
          helm list -A -q | xargs -I {} helm uninstall {} || true
          kubectl delete ingress --all --all-namespaces || true
          kubectl delete svc --all --all-namespaces --field-selector metadata.name!=kubernetes || true
          kubectl delete pvc --all --all-namespaces --wait=false || true

          echo "⏳ Waiting 60s for AWS Load Balancers and EBS volumes to be cleanly released (otherwise VPC deletion fails)..."
          sleep 60

          # The kubectl cleanup above is best effort (cluster unreachable, controller slow, earlier
          # partial destroy). Load balancers, their ENIs/public IPs and k8s-* security groups are not
          # in Terraform state and block subnet/IGW deletion with DependencyViolation, so remove
          # whatever is still left in the cluster VPC directly via the AWS API.
          CLUSTER_NAME="${CLUSTER_NAME:-crack-detection-cluster}"
          export AWS_DEFAULT_REGION="$REGION"
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${CLUSTER_NAME}-vpc" \
            --query 'Vpcs[0].VpcId' --output text 2>/dev/null || true)
          if [[ -z "$VPC_ID" || "$VPC_ID" == "None" ]]; then
            echo "VPC '${CLUSTER_NAME}-vpc' not found - nothing left to clean up."
            exit 0
          fi
          echo "Cleaning up Kubernetes-created resources in $VPC_ID..."

          for ARN in $(aws elbv2 describe-load-balancers --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" --output text); do
            echo "Deleting load balancer $ARN"
            aws elbv2 delete-load-balancer --load-balancer-arn "$ARN" || true
          done
          for NAME in $(aws elb describe-load-balancers --query "LoadBalancerDescriptions[?VPCId=='$VPC_ID'].LoadBalancerName" --output text); do
            echo "Deleting classic load balancer $NAME"
            aws elb delete-load-balancer --load-balancer-name "$NAME" || true
          done
          for TG in $(aws elbv2 describe-target-groups --query "TargetGroups[?VpcId=='$VPC_ID'].TargetGroupArn" --output text); do
            aws elbv2 delete-target-group --target-group-arn "$TG" || true
          done

          # Load balancer ENIs (and their public IPs) disappear asynchronously.
          for i in $(seq 1 30); do
            LB_ENIS=$(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$VPC_ID" \
              --query "NetworkInterfaces[?starts_with(Description, 'ELB ')].NetworkInterfaceId" --output text || true)
            [[ -z "$LB_ENIS" ]] && break
            echo "Waiting for load balancer network interfaces to be released ($i/30): $LB_ENIS"
            sleep 10
          done

          for ENI in $(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$VPC_ID" "Name=status,Values=available" \
              --query 'NetworkInterfaces[].NetworkInterfaceId' --output text); do
            echo "Deleting detached network interface $ENI"
            aws ec2 delete-network-interface --network-interface-id "$ENI" || true
          done

          # Security groups created by Kubernetes for load balancers (k8s-elb-*, k8s-*): first drop rules
          # in other groups that reference them, then delete them.
          ALL_SGS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" --query 'SecurityGroups[].GroupId' --output text || true)
          for SG in $(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" \
              --query "SecurityGroups[?starts_with(GroupName, 'k8s-')].GroupId" --output text); do
            for OTHER in $ALL_SGS; do
              RULES=$(aws ec2 describe-security-group-rules --filters "Name=group-id,Values=$OTHER" \
                --query "SecurityGroupRules[?ReferencedGroupInfo.GroupId=='$SG' && !IsEgress].SecurityGroupRuleId" --output text || true)
              [[ -n "$RULES" ]] && aws ec2 revoke-security-group-ingress --group-id "$OTHER" --security-group-rule-ids $RULES >/dev/null || true
            done
            echo "Deleting Kubernetes security group $SG"
            aws ec2 delete-security-group --group-id "$SG" || true
          done

      # ==== Run Terraform destroy (plan was already created above) ====
      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        env:
          TF_VAR_digitalocean_token: ${{ github.event.inputs.do_token }}
        run: |
          if [[ "${{ github.event.inputs.provider }}" == "gcp" ]]; then
            export TF_VAR_project_id="${{ github.event.inputs.gcp_project_id }}"
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_zone="${{ github.event.inputs.gcp_cluster_zone }}"
          elif [[ "${{ github.event.inputs.provider }}" == "digitalocean" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_region="${{ github.event.inputs.do_cluster_region }}"
          elif [[ "${{ github.event.inputs.provider }}" == "azure" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_location="${{ github.event.inputs.azure_location }}"
          elif [[ "${{ github.event.inputs.provider }}" == "aws" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_region="${{ github.event.inputs.aws_region }}"
          fi
          terraform apply -auto-approve tfplan
        working-directory: ${{ steps.setdir.outputs.dir }}

      # ==== Post-apply: print connect command (GCP) ====
      - name: Output cluster connect command (GCP)
        if: ${{ github.event.inputs.action == 'apply' && github.event.inputs.provider == 'gcp' }}
        run: |
          echo "============================================"
          echo "  GKE Cluster Connect Command"
          echo "============================================"
          echo "gcloud container clusters get-credentials ${{ github.event.inputs.cluster_name }} --zone ${{ github.event.inputs.gcp_cluster_zone }} --project ${{ github.event.inputs.gcp_project_id }}"
          echo "============================================"

      # ==== Post-apply: print connect command (DigitalOcean) ====
      - name: Install doctl (for DO connect command)
        if: ${{ github.event.inputs.action == 'apply' && github.event.inputs.provider == 'digitalocean' }}
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.97.0/doctl-1.97.0-linux-amd64.tar.gz | tar -xz
          sudo mv doctl /usr/local/bin/

      - name: Output DOKS cluster connect command
        if: ${{ github.event.inputs.action == 'apply' && github.event.inputs.provider == 'digitalocean' }}
        run: |
          echo "============================================"
          echo "  DOKS Cluster Connect Command"
          echo "============================================"
          echo "doctl auth init -t <YOUR_DO_TOKEN>"
          echo "doctl kubernetes cluster kubeconfig save ${{ github.event.inputs.cluster_name }}"
          echo "============================================"

      # ==== Post-apply: print connect command (Azure) ====
      - name: Output AKS cluster connect command
        if: ${{ github.event.inputs.action == 'apply' && github.event.inputs.provider == 'azure' }}
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          RG="${{ github.event.inputs.azure_resource_group }}"
          if [ -z "$RG" ]; then
            RG="${CLUSTER_NAME}-rg"
          fi
          echo "============================================"
          echo "  AKS Cluster Connect Command"
          echo "============================================"
          echo "az aks get-credentials --resource-group $RG --name $CLUSTER_NAME --overwrite-existing"
          echo "kubectl get nodes"
          echo "============================================"

      # ==== Post-apply: print connect command (AWS) ====
      - name: Output EKS cluster connect command
        if: ${{ github.event.inputs.action == 'apply' && github.event.inputs.provider == 'aws' }}
        run: |
          echo "============================================"
          echo "  EKS Cluster Connect Command"
          echo "============================================"
          echo "aws eks update-kubeconfig --region ${{ github.event.inputs.aws_region }} --name ${{ github.event.inputs.cluster_name }}"
          echo "kubectl get nodes"
          echo "============================================"

      # ==== Post-destroy: delete SSL certificates (GCP) ====
      - name: Delete all SSL certificates
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'gcp' }}
        run: |
          GCP_PROJECT="${{ github.event.inputs.gcp_project_id }}"
          echo "Fetching all SSL certificates..."
          CERTS=$(gcloud compute ssl-certificates list --project=$GCP_PROJECT --format="value(name)" 2>/dev/null || true)
          if [[ -z "$CERTS" ]]; then
            echo "No SSL certificates found, nothing to delete."
          else
            echo "Deleting SSL certificates: $CERTS"
            echo "$CERTS" | xargs -I {} gcloud compute ssl-certificates delete {} --project=$GCP_PROJECT --quiet
            echo "All SSL certificates deleted."
          fi

      # ==== Post-destroy: delete static IP (GCP) ====
      - name: Delete global static IP
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'gcp' }}
        run: |
          IP_NAME="concrete-detection-ip"
          GCP_PROJECT="${{ github.event.inputs.gcp_project_id }}"
          EXISTING_IP=$(gcloud compute addresses describe $IP_NAME --global --project=$GCP_PROJECT --format="value(address)" 2>/dev/null || true)
          if [[ -n "$EXISTING_IP" ]]; then
            echo "Deleting static IP '$IP_NAME' ($EXISTING_IP)..."
            gcloud compute addresses delete $IP_NAME --global --project=$GCP_PROJECT --quiet
            echo "Static IP deleted."
          else
            echo "Static IP '$IP_NAME' not found, skipping."
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f tfplan
          rm -f $HOME/gcp-key.json
        working-directory: ${{ steps.setdir.outputs.dir }}
