name: Deploy Kubernetes Cluster (GCP / DigitalOcean / Azure AKS)

# ===========================================================
# HOW TO USE THIS PIPELINE
# ===========================================================
# GCP users:
#   1. Get your service account JSON key file
#   2. Base64 encode it into a SINGLE LINE (no line breaks):
#      Linux:   base64 -w 0 key.json
#      Mac:     base64 -i key.json | tr -d '\n'
#      Windows: [Convert]::ToBase64String([IO.File]::ReadAllBytes("key.json"))
#   3. Paste the single-line output into gcp_sa_key_base64 input
#
# DigitalOcean users:
#   1. Get your API token from https://cloud.digitalocean.com/account/api/tokens
#   2. Fill in the DO inputs below when triggering the workflow
#
# Azure (AKS) users:
#   1. Run "Setup Azure Service Principal & Backend" workflow or use existing SP
#   2. Fill in the Azure inputs (azure_subscription_id, azure_tenant_id,
#      azure_client_id, azure_client_secret, azure_storage_account)
# ============================================================

on:
  workflow_dispatch:
    inputs:

      # Common (3 inputs)
      provider:
        description: "Cloud provider to use"
        required: true
        default: "gcp"
        type: choice
        options:
          - gcp
          - digitalocean
          - azure

      action:
        description: "Apply = create cluster | Destroy = delete cluster"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

      cluster_name:
        description: "Cluster name (GKE, DOKS, or AKS)"
        required: false
        default: "crack-detection-cluster"
        type: string

      # ---- GCP inputs (fill these if provider = gcp) (8 inputs) ----
      gcp_account_name:
        description: "[GCP] Account Name for logging / verification"
        required: false
        default: "maheshrajannan"
        type: choice
        options:
          - maheshrajannan
          - empowerinnovate
          - custom

      gcp_custom_account_name:
        description: "[GCP] Custom Account Name (used only if Account Name above is set to 'custom')"
        required: false
        type: string

      gcp_project_id:
        description: "[GCP] Your GCP project ID  e.g. my-project-123"
        required: false
        type: string

      gcp_sa_key_base64:
        description: "[GCP] SA key base64 single-line. Linux: base64 -w 0 key.json | Mac: base64 -i key.json | tr -d '\\n'"
        required: false
        type: string

      gcp_backend_bucket:
        description: "[GCP] GCS bucket name for Terraform backend"
        required: false
        default: "crack-detection-terraform"
        type: choice
        options:
          - crack-detection-terraform
          - crack-detection-terraform-1
          - custom

      gcp_custom_backend_bucket:
        description: "[GCP] Custom GCS bucket name (used only if GCS bucket name above is set to 'custom')"
        required: false
        type: string

      gcp_cluster_zone:
        description: "[GCP] Zone for the GKE cluster  e.g. us-central1-a"
        required: false
        default: "us-central1-a"
        type: string

      gcp_terraform_dir:
        description: "[GCP] Terraform directory to use  e.g. ./gcp-cluster"
        required: false
        default: "./gcp-cluster"
        type: string

      # ---- DigitalOcean inputs (fill these if provider = digitalocean) (5 inputs) ----
      do_token:
        description: "[DO] DigitalOcean API token"
        required: false
        type: string

      do_access_key:
        description: "[DO] Spaces access key (Terraform backend)"
        required: false
        type: string

      do_secret_key:
        description: "[DO] Spaces secret key (Terraform backend)"
        required: false
        type: string

      do_terraform_dir:
        description: "[DO] Terraform directory to use  e.g. ./digitalocean-cluster"
        required: false
        default: "./digitalocean-cluster"
        type: string

      do_cluster_region:
        description: "[DO] Region for the DOKS cluster  e.g. nyc3"
        required: false
        default: "nyc3"
        type: string

      # ---- Azure inputs (fill these if provider = azure) (6 inputs, total = 22 <= 25) ----
      azure_subscription_id:
        description: "[Azure] Subscription ID"
        required: false
        type: string

      azure_tenant_id:
        description: "[Azure] Tenant ID (Directory ID)"
        required: false
        type: string

      azure_client_id:
        description: "[Azure] Service Principal Client ID (App ID)"
        required: false
        type: string

      azure_client_secret:
        description: "[Azure] Service Principal Client Secret"
        required: false
        type: string

      azure_resource_group:
        description: "[Azure] Resource Group for AKS (leave blank to auto-create '<cluster_name>-rg')"
        required: false
        type: string

      azure_storage_account:
        description: "[Azure] Storage Account name for Terraform backend"
        required: false
        type: string

      azure_location:
        description: "[Azure] Region for the AKS cluster  e.g. eastus"
        required: false
        default: "eastus"
        type: string

jobs:
  provision-cluster:
    name: Provision Kubernetes Cluster
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print input parameters
        run: |
          RAW_KEY="${{ github.event.inputs.gcp_sa_key_base64 }}"
          if [ -n "$RAW_KEY" ]; then
            KEY_15="${RAW_KEY:0:15}"
            SPACED_15=$(echo "$KEY_15" | sed 's/./& /g')
            TOKEN_INFO="Token preview (spaced): $SPACED_15"
          else
            TOKEN_INFO="NOT provided"
          fi

          RAW_AZ_SECRET="${{ github.event.inputs.azure_client_secret }}"
          if [ -n "$RAW_AZ_SECRET" ]; then
            AZ_SEC_15="${RAW_AZ_SECRET:0:15}"
            SPACED_AZ_15=$(echo "$AZ_SEC_15" | sed 's/./& /g')
            AZ_SECRET_INFO="Secret preview (spaced): $SPACED_AZ_15"
          else
            AZ_SECRET_INFO="NOT provided (will check secrets)"
          fi

          echo "================================================"
          echo "  Pipeline Input Parameters"
          echo "================================================"
          echo "  provider                : ${{ github.event.inputs.provider }}"
          echo "  action                  : ${{ github.event.inputs.action }}"
          echo "  cluster_name            : ${{ github.event.inputs.cluster_name }}"
          echo "  gcp_project_id          : ${{ github.event.inputs.gcp_project_id }}"
          echo "  gcp_cluster_zone        : ${{ github.event.inputs.gcp_cluster_zone }}"
          echo "  gcp_terraform_dir       : ${{ github.event.inputs.gcp_terraform_dir }}"
          echo "  do_terraform_dir        : ${{ github.event.inputs.do_terraform_dir }}"
          echo "  do_cluster_region       : ${{ github.event.inputs.do_cluster_region }}"
          echo "  do_token                : ${{ github.event.inputs.do_token != '' && 'provided' || 'NOT provided' }}"
          echo "  do_access_key           : ${{ github.event.inputs.do_access_key != '' && 'provided' || 'NOT provided' }}"
          echo "  do_secret_key           : ${{ github.event.inputs.do_secret_key != '' && 'provided' || 'NOT provided' }}"
          echo "  gcp_sa_key_base64       : $TOKEN_INFO"
          echo "  gcp_backend_bucket      : ${{ github.event.inputs.gcp_backend_bucket }}"
          echo "  azure_subscription_id   : ${{ github.event.inputs.azure_subscription_id }}"
          echo "  azure_tenant_id         : ${{ github.event.inputs.azure_tenant_id }}"
          echo "  azure_client_id         : ${{ github.event.inputs.azure_client_id != '' && 'provided' || 'NOT provided' }}"
          echo "  azure_client_secret     : $AZ_SECRET_INFO"
          echo "  azure_resource_group    : ${{ github.event.inputs.azure_resource_group }}"
          echo "  azure_storage_account   : ${{ github.event.inputs.azure_storage_account }}"
          echo "  azure_location          : ${{ github.event.inputs.azure_location }}"
          echo "================================================"

      - name: Print Account & Target Info (GCP)
        if: ${{ github.event.inputs.provider == 'gcp' }}
        run: |
          ACCT="${{ github.event.inputs.gcp_account_name }}"
          if [ "$ACCT" = "custom" ]; then
            ACCT="${{ github.event.inputs.gcp_custom_account_name }}"
          fi
          if [ -z "$ACCT" ]; then
            ACCT="maheshrajannan"
          fi
          RAW_KEY="${{ github.event.inputs.gcp_sa_key_base64 }}"
          if [ -n "$RAW_KEY" ]; then
            KEY_15="${RAW_KEY:0:15}"
            SPACED_15=$(echo "$KEY_15" | sed 's/./& /g')
          else
            SPACED_15="NOT provided"
          fi
          echo "======================================================"
          echo " Target GCP Account Name: $ACCT"
          echo " GCP Project ID:          ${{ github.event.inputs.gcp_project_id }}"
          echo " SA Key Preview (15 chars): $SPACED_15"
          echo "======================================================"

      - name: Print Account & Target Info (Azure)
        if: ${{ github.event.inputs.provider == 'azure' }}
        run: |
          SUB_ID="${{ github.event.inputs.azure_subscription_id }}"
          echo "======================================================"
          echo " Azure Subscription ID:      ${SUB_ID:0:8}...${SUB_ID: -4}"
          echo " Azure Tenant ID:            ${{ github.event.inputs.azure_tenant_id }}"
          echo " Azure Location:             ${{ github.event.inputs.azure_location }}"
          echo " Cluster Name:               ${{ github.event.inputs.cluster_name }}"
          echo " Storage Account (State):    ${{ github.event.inputs.azure_storage_account }}"
          echo "======================================================"

      - name: Validate required inputs
        run: |
          PROVIDER="${{ github.event.inputs.provider }}"
          if [[ "$PROVIDER" == "gcp" ]]; then
            [[ -z "${{ github.event.inputs.gcp_project_id }}" ]]  && echo "ERROR: gcp_project_id is required"  && exit 1
            [[ -z "${{ github.event.inputs.gcp_sa_key_base64 }}" ]] && echo "ERROR: gcp_sa_key_base64 is required" && exit 1
            [[ -z "${{ github.event.inputs.gcp_backend_bucket }}" ]] && echo "ERROR: gcp_backend_bucket is required" && exit 1
            echo "GCP inputs validated."
          fi
          if [[ "$PROVIDER" == "digitalocean" ]]; then
            [[ -z "${{ github.event.inputs.do_token }}" ]] && echo "ERROR: do_token is required" && exit 1
            echo "DigitalOcean inputs validated."
          fi
          if [[ "$PROVIDER" == "azure" ]]; then
            [[ -z "${{ github.event.inputs.azure_subscription_id }}" ]] && echo "ERROR: azure_subscription_id is required" && exit 1
            [[ -z "${{ github.event.inputs.azure_tenant_id }}" ]]       && echo "ERROR: azure_tenant_id is required" && exit 1
            [[ -z "${{ github.event.inputs.azure_client_id }}" && -z "${{ secrets.AZURE_CLIENT_ID }}" ]] && echo "ERROR: azure_client_id is required" && exit 1
            [[ -z "${{ github.event.inputs.azure_client_secret }}" && -z "${{ secrets.AZURE_CLIENT_SECRET }}" ]] && echo "ERROR: azure_client_secret is required" && exit 1
            [[ -z "${{ github.event.inputs.azure_storage_account }}" ]] && echo "ERROR: azure_storage_account is required" && exit 1
            echo "Azure inputs validated."
          fi

      - name: Set working directory
        id: setdir
        run: |
          if [[ "${{ github.event.inputs.provider }}" == "gcp" ]]; then
            echo "dir=${{ github.event.inputs.gcp_terraform_dir }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.provider }}" == "digitalocean" ]]; then
            echo "dir=${{ github.event.inputs.do_terraform_dir }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.provider }}" == "azure" ]]; then
            echo "dir=./azure-cluster" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # ==== GCP Auth ====
      - name: Decode and authenticate to GCP
        if: ${{ github.event.inputs.provider == 'gcp' }}
        env:
          GCP_SA_KEY_BASE64: ${{ github.event.inputs.gcp_sa_key_base64 }}
        run: |
          if [ -n "$GCP_SA_KEY_BASE64" ]; then
            KEY_15="${GCP_SA_KEY_BASE64:0:15}"
            SPACED_15=$(echo "$KEY_15" | sed 's/./& /g')
            echo "First 15 characters of provided SA key token (raw): ${KEY_15}"
            echo "First 15 characters of provided SA key token (spaced): ${SPACED_15}"
          else
            echo "No custom base64 SA key provided in input. Using default secrets."
          fi
          echo "$GCP_SA_KEY_BASE64" | tr -d '\n' | base64 -d > $HOME/gcp-key.json
          gcloud auth activate-service-account --key-file=$HOME/gcp-key.json
          gcloud config set project ${{ github.event.inputs.gcp_project_id }}
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json" >> $GITHUB_ENV

      - name: Install gke-gcloud-auth-plugin
        if: ${{ github.event.inputs.provider == 'gcp' }}
        run: |
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
          sudo apt-get update -y
          sudo apt-get install -y google-cloud-cli-gke-gcloud-auth-plugin

      # ==== Azure Auth ====
      - name: Authenticate to Azure
        if: ${{ github.event.inputs.provider == 'azure' }}
        env:
          INPUT_CLIENT_ID: ${{ github.event.inputs.azure_client_id }}
          INPUT_CLIENT_SECRET: ${{ github.event.inputs.azure_client_secret }}
          SECRET_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SECRET_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TENANT_ID: ${{ github.event.inputs.azure_tenant_id }}
          SUBSCRIPTION_ID: ${{ github.event.inputs.azure_subscription_id }}
        run: |
          CLIENT_ID="${INPUT_CLIENT_ID:-$SECRET_CLIENT_ID}"
          CLIENT_SECRET="${INPUT_CLIENT_SECRET:-$SECRET_CLIENT_SECRET}"

          echo "::add-mask::$CLIENT_SECRET"
          echo "ARM_CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$CLIENT_SECRET" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$TENANT_ID" >> $GITHUB_ENV

          az login --service-principal -u "$CLIENT_ID" -p "$CLIENT_SECRET" --tenant "$TENANT_ID"
          az account set --subscription "$SUBSCRIPTION_ID"
          echo "Azure CLI authenticated for Subscription: $SUBSCRIPTION_ID"

      # ==== Terraform Init ====
      - name: Terraform Init (GCP)
        if: ${{ github.event.inputs.provider == 'gcp' }}
        run: |
          BUCKET="${{ github.event.inputs.gcp_backend_bucket }}"
          if [ "$BUCKET" = "custom" ]; then
            BUCKET="${{ github.event.inputs.gcp_custom_backend_bucket }}"
          fi
          if [ -z "$BUCKET" ]; then
            BUCKET="crack-detection-terraform"
          fi
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          if [ -z "$CLUSTER_NAME" ]; then
            CLUSTER_NAME="crack-detection-cluster"
          fi
          echo "Initializing Terraform GCS backend with bucket=$BUCKET and prefix=gke/$CLUSTER_NAME"
          terraform init -input=false -backend-config="bucket=$BUCKET" -backend-config="prefix=gke/$CLUSTER_NAME"
        working-directory: ${{ steps.setdir.outputs.dir }}

      - name: Terraform Init (DigitalOcean)
        if: ${{ github.event.inputs.provider == 'digitalocean' }}
        env:
          TF_VAR_digitalocean_token: ${{ github.event.inputs.do_token }}
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          if [ -z "$CLUSTER_NAME" ]; then
            CLUSTER_NAME="crack-detection-cluster"
          fi
          echo "Initializing Terraform DO backend with key=DO-cluster/${CLUSTER_NAME}.tfstate"
          for attempt in 1 2 3; do
            echo "Terraform init attempt $attempt of 3..."
            terraform init -input=false \
              -backend-config="access_key=${{ github.event.inputs.do_access_key }}" \
              -backend-config="secret_key=${{ github.event.inputs.do_secret_key }}" \
              -backend-config="key=DO-cluster/${CLUSTER_NAME}.tfstate" && break
            if [[ $attempt -lt 3 ]]; then
              echo "Init failed, retrying in 30s..."
              sleep 30
            else
              echo "Terraform init failed after 3 attempts."
              exit 1
            fi
          done
        working-directory: ${{ steps.setdir.outputs.dir }}

      - name: Terraform Init (Azure)
        if: ${{ github.event.inputs.provider == 'azure' }}
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          if [ -z "$CLUSTER_NAME" ]; then
            CLUSTER_NAME="crack-detection-cluster"
          fi
          STORAGE_ACCOUNT="${{ github.event.inputs.azure_storage_account }}"
          CONTAINER="tfstate"
          LOCATION="${{ github.event.inputs.azure_location }}"
          if [ -z "$LOCATION" ]; then
            LOCATION="eastus"
          fi

          # Discover or configure the storage account resource group
          SA_RG=$(az storage account list --query "[?name=='$STORAGE_ACCOUNT'].resourceGroup" -o tsv 2>/dev/null || echo "")
          if [ -z "$SA_RG" ]; then
            SA_RG="${{ github.event.inputs.azure_resource_group }}"
          fi
          if [ -z "$SA_RG" ]; then
            SA_RG="crack-detection-tfstate-rg"
          fi

          # Ensure the backend Resource Group exists
          if ! az group show --name "$SA_RG" &>/dev/null; then
            echo "Resource Group '$SA_RG' does not exist. Creating in $LOCATION..."
            az group create --name "$SA_RG" --location "$LOCATION" --tags Environment=production Project=crack-detection
          fi

          # Ensure the backend Storage Account exists
          if ! az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$SA_RG" &>/dev/null; then
            echo "Storage Account '$STORAGE_ACCOUNT' does not exist. Creating in $SA_RG ($LOCATION)..."
            az storage account create \
              --name "$STORAGE_ACCOUNT" \
              --resource-group "$SA_RG" \
              --location "$LOCATION" \
              --sku Standard_LRS \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false
          fi

          # Ensure the Blob Container exists
          echo "Ensuring backend blob container '$CONTAINER' exists in storage account '$STORAGE_ACCOUNT'..."
          az storage container create \
            --name "$CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login 2>/dev/null || true

          echo "Initializing Terraform Azure backend:"
          echo "  resource_group_name  = $SA_RG"
          echo "  storage_account_name = $STORAGE_ACCOUNT"
          echo "  container_name       = $CONTAINER"
          echo "  key                  = aks/${CLUSTER_NAME}.tfstate"

          terraform init -input=false \
            -backend-config="resource_group_name=$SA_RG" \
            -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
            -backend-config="container_name=$CONTAINER" \
            -backend-config="key=aks/${CLUSTER_NAME}.tfstate"
        working-directory: ${{ steps.setdir.outputs.dir }}

      # ==== Terraform Plan / Apply / Destroy ====
      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ steps.setdir.outputs.dir }}

      - name: Terraform Plan
        env:
          TF_VAR_digitalocean_token: ${{ github.event.inputs.do_token }}
        run: |
          if [[ "${{ github.event.inputs.provider }}" == "gcp" ]]; then
            export TF_VAR_project_id="${{ github.event.inputs.gcp_project_id }}"
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_zone="${{ github.event.inputs.gcp_cluster_zone }}"
          elif [[ "${{ github.event.inputs.provider }}" == "digitalocean" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_region="${{ github.event.inputs.do_cluster_region }}"
          elif [[ "${{ github.event.inputs.provider }}" == "azure" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_location="${{ github.event.inputs.azure_location }}"
            if [ -n "${{ github.event.inputs.azure_resource_group }}" ]; then
              export TF_VAR_resource_group_name="${{ github.event.inputs.azure_resource_group }}"
            fi
          fi
          
          if [[ "${{ github.event.inputs.action }}" == "apply" ]]; then
            terraform plan -out=tfplan
          else
            terraform plan -destroy -out=tfplan
          fi
        working-directory: ${{ steps.setdir.outputs.dir }}

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        env:
          TF_VAR_digitalocean_token: ${{ github.event.inputs.do_token }}
        run: |
          if [[ "${{ github.event.inputs.provider }}" == "gcp" ]]; then
            export TF_VAR_project_id="${{ github.event.inputs.gcp_project_id }}"
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_zone="${{ github.event.inputs.gcp_cluster_zone }}"
          elif [[ "${{ github.event.inputs.provider }}" == "digitalocean" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_region="${{ github.event.inputs.do_cluster_region }}"
          elif [[ "${{ github.event.inputs.provider }}" == "azure" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_location="${{ github.event.inputs.azure_location }}"
            if [ -n "${{ github.event.inputs.azure_resource_group }}" ]; then
              export TF_VAR_resource_group_name="${{ github.event.inputs.azure_resource_group }}"
            fi
          fi
          terraform apply -auto-approve tfplan
        working-directory: ${{ steps.setdir.outputs.dir }}

      # ==== Pre-destroy: clean up DO LoadBalancers and Volumes via DO API (no kubectl needed) ====
      - name: Install doctl (DO pre-destroy cleanup)
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'digitalocean' }}
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.97.0/doctl-1.97.0-linux-amd64.tar.gz | tar -xz
          sudo mv doctl /usr/local/bin/
          doctl auth init -t ${{ github.event.inputs.do_token }}

      - name: Delete all DO LoadBalancers via API (DigitalOcean pre-destroy)
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'digitalocean' }}
        run: |
          echo "Fetching all LoadBalancers in your DO account..."
          LB_IDS=$(doctl compute load-balancer list --format ID --no-header 2>/dev/null || true)
          if [[ -z "$LB_IDS" ]]; then
            echo "No LoadBalancers found, skipping."
          else
            echo "Deleting LoadBalancers: $LB_IDS"
            for LB_ID in $LB_IDS; do
              echo "Deleting LoadBalancer $LB_ID..."
              doctl compute load-balancer delete "$LB_ID" --force
            done
            echo "⏳ Waiting 20s for DO to release LoadBalancers..."
            sleep 20
            echo "✅ All LoadBalancers deleted"
          fi

      - name: Delete all DO Block Storage Volumes via API (DigitalOcean pre-destroy)
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'digitalocean' }}
        run: |
          echo "Fetching all Block Storage Volumes in your DO account..."
          VOL_IDS=$(doctl compute volume list --format ID --no-header 2>/dev/null || true)
          if [[ -z "$VOL_IDS" ]]; then
            echo "No Volumes found, skipping."
          else
            echo "Deleting Volumes: $VOL_IDS"
            for VOL_ID in $VOL_IDS; do
              echo "Deleting Volume $VOL_ID..."
              doctl compute volume delete "$VOL_ID" --force || true
            done
            echo "✅ All Volumes deleted"
          fi

      # ==== Pre-destroy: clean up GCP LoadBalancers and NEGs via Kubernetes controllers & gcloud ====
      - name: GKE Pre-Destroy Cleanup (GCP)
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'gcp' }}
        run: |
          echo "Connecting to GKE cluster..."
          gcloud container clusters get-credentials "${{ github.event.inputs.cluster_name }}" --zone "${{ github.event.inputs.gcp_cluster_zone }}" --project "${{ github.event.inputs.gcp_project_id }}" || true
          
          echo "Uninstalling helm charts and deleting ingresses/services to trigger resource cleanup..."
          helm list -A -q | xargs -I {} helm uninstall {} || true
          kubectl delete ingress --all --all-namespaces || true
          kubectl delete svc --all --all-namespaces --field-selector metadata.name!=kubernetes || true
          
          echo "⏳ Waiting 60s for GCP Load Balancers and NEGs to be cleanly deleted by controllers..."
          sleep 60
          
          echo "Deleting any leftover NEGs..."
          ZONE="${{ github.event.inputs.gcp_cluster_zone }}"
          PROJECT="${{ github.event.inputs.gcp_project_id }}"
          NEGS=$(gcloud compute network-endpoint-groups list --zone="$ZONE" --project="$PROJECT" --format="value(name)" 2>/dev/null || true)
          if [[ -n "$NEGS" ]]; then
            echo "Leftover NEGs found: $NEGS"
            for NEG in $NEGS; do
              # Try to delete associated backend service first if it exists
              gcloud compute backend-services delete "$NEG" --global --quiet --project="$PROJECT" || true
              gcloud compute network-endpoint-groups delete "$NEG" --zone="$ZONE" --quiet --project="$PROJECT" || true
            done
          fi

      # ==== Pre-destroy: clean up Azure LoadBalancers and Services ====
      - name: AKS Pre-Destroy Cleanup (Azure)
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'azure' }}
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          RG="${{ github.event.inputs.azure_resource_group }}"
          if [ -z "$RG" ]; then
            RG="${CLUSTER_NAME}-rg"
          fi

          echo "Connecting to AKS cluster $CLUSTER_NAME in $RG..."
          az aks get-credentials --resource-group "$RG" --name "$CLUSTER_NAME" --overwrite-existing || true

          echo "Uninstalling helm charts and deleting ingresses/services to release Azure Load Balancers and Public IPs..."
          helm list -A -q | xargs -I {} helm uninstall {} || true
          kubectl delete ingress --all --all-namespaces || true
          kubectl delete svc --all --all-namespaces --field-selector metadata.name!=kubernetes || true

          echo "⏳ Waiting 30s for Azure Load Balancers and Public IPs to be cleanly released..."
          sleep 30

      # ==== Run Terraform destroy (plan was already created above) ====
      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        env:
          TF_VAR_digitalocean_token: ${{ github.event.inputs.do_token }}
        run: |
          if [[ "${{ github.event.inputs.provider }}" == "gcp" ]]; then
            export TF_VAR_project_id="${{ github.event.inputs.gcp_project_id }}"
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_zone="${{ github.event.inputs.gcp_cluster_zone }}"
          elif [[ "${{ github.event.inputs.provider }}" == "digitalocean" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_region="${{ github.event.inputs.do_cluster_region }}"
          elif [[ "${{ github.event.inputs.provider }}" == "azure" ]]; then
            export TF_VAR_cluster_name="${{ github.event.inputs.cluster_name }}"
            export TF_VAR_location="${{ github.event.inputs.azure_location }}"
            if [ -n "${{ github.event.inputs.azure_resource_group }}" ]; then
              export TF_VAR_resource_group_name="${{ github.event.inputs.azure_resource_group }}"
            fi
          fi
          terraform apply -auto-approve tfplan
        working-directory: ${{ steps.setdir.outputs.dir }}

      # ==== Post-apply: print connect command (GCP) ====
      - name: Output cluster connect command (GCP)
        if: ${{ github.event.inputs.action == 'apply' && github.event.inputs.provider == 'gcp' }}
        run: |
          echo "============================================"
          echo "  GKE Cluster Connect Command"
          echo "============================================"
          echo "gcloud container clusters get-credentials ${{ github.event.inputs.cluster_name }} --zone ${{ github.event.inputs.gcp_cluster_zone }} --project ${{ github.event.inputs.gcp_project_id }}"
          echo "============================================"

      # ==== Post-apply: print connect command (DigitalOcean) ====
      - name: Install doctl (for DO connect command)
        if: ${{ github.event.inputs.action == 'apply' && github.event.inputs.provider == 'digitalocean' }}
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.97.0/doctl-1.97.0-linux-amd64.tar.gz | tar -xz
          sudo mv doctl /usr/local/bin/

      - name: Output DOKS cluster connect command
        if: ${{ github.event.inputs.action == 'apply' && github.event.inputs.provider == 'digitalocean' }}
        run: |
          echo "============================================"
          echo "  DOKS Cluster Connect Command"
          echo "============================================"
          echo "doctl auth init -t <YOUR_DO_TOKEN>"
          echo "doctl kubernetes cluster kubeconfig save ${{ github.event.inputs.cluster_name }}"
          echo "============================================"

      # ==== Post-apply: print connect command (Azure) ====
      - name: Output AKS cluster connect command
        if: ${{ github.event.inputs.action == 'apply' && github.event.inputs.provider == 'azure' }}
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          RG="${{ github.event.inputs.azure_resource_group }}"
          if [ -z "$RG" ]; then
            RG="${CLUSTER_NAME}-rg"
          fi
          echo "============================================"
          echo "  AKS Cluster Connect Command"
          echo "============================================"
          echo "az aks get-credentials --resource-group $RG --name $CLUSTER_NAME --overwrite-existing"
          echo "kubectl get nodes"
          echo "============================================"

      # ==== Post-destroy: delete SSL certificates (GCP) ====
      - name: Delete all SSL certificates
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'gcp' }}
        run: |
          GCP_PROJECT="${{ github.event.inputs.gcp_project_id }}"
          echo "Fetching all SSL certificates..."
          CERTS=$(gcloud compute ssl-certificates list --project=$GCP_PROJECT --format="value(name)" 2>/dev/null || true)
          if [[ -z "$CERTS" ]]; then
            echo "No SSL certificates found, nothing to delete."
          else
            echo "Deleting SSL certificates: $CERTS"
            echo "$CERTS" | xargs -I {} gcloud compute ssl-certificates delete {} --project=$GCP_PROJECT --quiet
            echo "All SSL certificates deleted."
          fi

      # ==== Post-destroy: delete static IP (GCP) ====
      - name: Delete global static IP
        if: ${{ github.event.inputs.action == 'destroy' && github.event.inputs.provider == 'gcp' }}
        run: |
          IP_NAME="concrete-detection-ip"
          GCP_PROJECT="${{ github.event.inputs.gcp_project_id }}"
          EXISTING_IP=$(gcloud compute addresses describe $IP_NAME --global --project=$GCP_PROJECT --format="value(address)" 2>/dev/null || true)
          if [[ -n "$EXISTING_IP" ]]; then
            echo "Deleting static IP '$IP_NAME' ($EXISTING_IP)..."
            gcloud compute addresses delete $IP_NAME --global --project=$GCP_PROJECT --quiet
            echo "Static IP deleted."
          else
            echo "Static IP '$IP_NAME' not found, skipping."
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f tfplan
          rm -f $HOME/gcp-key.json
        working-directory: ${{ steps.setdir.outputs.dir }}
