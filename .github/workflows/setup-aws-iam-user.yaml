name: Setup AWS IAM User & Backend

# ===========================================================
# PHASE 1: AWS IAM USER & BACKEND SETUP
# ===========================================================
# This workflow sets up:
# 1. An S3 bucket for Terraform remote state
# 2. A DynamoDB table for Terraform state locking
# 3. An IAM user with PowerUserAccess + IAMFullAccess for EKS deployments
#
# Once completed, create an access key for the IAM user in the AWS console
# (IAM > Users > <user> > Security credentials > Create access key) and pass it
# as aws_access_key_id / aws_secret_access_key to the "Deploy Kubernetes Cluster" workflow.
# ===========================================================

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

      aws_account_name:
        description: 'AWS Account / Owner label for logging & verification'
        required: true
        default: 'maheshrajannan'
        type: choice
        options:
          - maheshrajannan
          - empowerinnovate
          - custom

      aws_custom_account_name:
        description: 'Custom AWS Account Name (used only if Account Name above is set to "custom")'
        required: false
        type: string

      aws_admin_access_key_id:
        description: 'Existing AWS Admin Access Key ID'
        required: true
        type: string

      aws_admin_secret_access_key:
        description: 'Existing AWS Admin Secret Access Key'
        required: true
        type: string

      aws_region:
        description: 'AWS Region for backend state'
        required: true
        default: 'us-east-1'
        type: string

      aws_state_bucket:
        description: 'S3 bucket for Terraform state (globally unique; if another account owns it, <name>-<account_id> is used)'
        required: true
        default: 'crack-detection-tfstate'
        type: string

      aws_lock_table:
        description: 'DynamoDB table name for Terraform state locking'
        required: true
        default: 'crack-detection-tflock'
        type: string

      aws_iam_user_name:
        description: 'Name of the new IAM user to be created for EKS'
        required: true
        default: 'crack-detection-eks-deployer'
        type: string

jobs:
  terraform-setup-aws:
    name: Setup AWS Prerequisites
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./aws-iam-user

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Account & Target Info
        run: |
          ACCT="${{ github.event.inputs.aws_account_name }}"
          if [ "$ACCT" = "custom" ]; then
            ACCT="${{ github.event.inputs.aws_custom_account_name }}"
          fi
          if [ -z "$ACCT" ]; then
            ACCT="maheshrajannan"
          fi

          echo "======================================================"
          echo " Target AWS Account Label:   $ACCT"
          echo " AWS Region:                 ${{ github.event.inputs.aws_region }}"
          echo " Target State Bucket:        ${{ github.event.inputs.aws_state_bucket }}"
          echo " Target Lock Table:          ${{ github.event.inputs.aws_lock_table }}"
          echo " Target IAM User:            ${{ github.event.inputs.aws_iam_user_name }}"
          echo " Admin Access Key ID:        ${{ github.event.inputs.aws_admin_access_key_id != '' && 'provided' || 'NOT provided' }}"
          echo " Admin Secret Access Key:    ${{ github.event.inputs.aws_admin_secret_access_key != '' && 'provided' || 'NOT provided' }}"
          echo "======================================================"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Authenticate to AWS
        env:
          ACCESS_KEY_ID: ${{ github.event.inputs.aws_admin_access_key_id }}
          SECRET_ACCESS_KEY: ${{ github.event.inputs.aws_admin_secret_access_key }}
          REGION: ${{ github.event.inputs.aws_region }}
        run: |

          if [ -z "$ACCESS_KEY_ID" ] || [ -z "$SECRET_ACCESS_KEY" ]; then
            echo "ERROR: AWS Access Key ID and Secret Access Key are required. Provide them in the workflow inputs."
            exit 1
          fi

          echo "::add-mask::$SECRET_ACCESS_KEY"
          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_REGION=$REGION" >> $GITHUB_ENV

          export AWS_ACCESS_KEY_ID="$ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$SECRET_ACCESS_KEY"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "Successfully authenticated to AWS Account: ${ACCOUNT_ID:0:4}...${ACCOUNT_ID: -4}"

      - name: Terraform Init
        run: terraform init -input=false

      # This workflow keeps no remote state, so every run starts empty. Import whatever
      # already exists in the account so reruns update it instead of failing with
      # "already exists" (and so destroy can actually find it).
      - name: Resolve state bucket & import existing resources
        env:
          BUCKET: ${{ github.event.inputs.aws_state_bucket }}
          TABLE: ${{ github.event.inputs.aws_lock_table }}
          IAM_USER: ${{ github.event.inputs.aws_iam_user_name }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # S3 names are global: 403 on head-bucket means another AWS account owns it.
          bucket_status() {
            local out
            if out=$(aws s3api head-bucket --bucket "$1" 2>&1); then echo owned
            elif grep -qE "403|Forbidden" <<<"$out"; then echo taken
            else echo free; fi
          }
          STATUS=$(bucket_status "$BUCKET")
          if [[ "$STATUS" == "taken" ]]; then
            NEW_BUCKET="${BUCKET}-${ACCOUNT_ID}"
            echo "::warning::S3 bucket '$BUCKET' belongs to another AWS account. Using '$NEW_BUCKET' instead - pass this as aws_state_bucket to the Deploy Kubernetes Cluster workflow."
            BUCKET="$NEW_BUCKET"
            STATUS=$(bucket_status "$BUCKET")
          fi

          {
            echo "TF_VAR_region=${{ github.event.inputs.aws_region }}"
            echo "TF_VAR_state_bucket_name=$BUCKET"
            echo "TF_VAR_lock_table_name=$TABLE"
            echo "TF_VAR_iam_user_name=$IAM_USER"
          } >> "$GITHUB_ENV"
          export TF_VAR_region="${{ github.event.inputs.aws_region }}" TF_VAR_state_bucket_name="$BUCKET" \
            TF_VAR_lock_table_name="$TABLE" TF_VAR_iam_user_name="$IAM_USER"

          imp() {
            echo "Importing existing $1 ($2)"
            terraform import -input=false "$1" "$2" >/dev/null || echo "::notice::Could not import $1 - Terraform will create/configure it."
          }
          if [[ "$STATUS" == "owned" ]]; then
            imp aws_s3_bucket.tfstate "$BUCKET"
            imp aws_s3_bucket_versioning.tfstate "$BUCKET"
            imp aws_s3_bucket_server_side_encryption_configuration.tfstate "$BUCKET"
            imp aws_s3_bucket_public_access_block.tfstate "$BUCKET"
          fi
          if aws dynamodb describe-table --table-name "$TABLE" >/dev/null 2>&1; then
            imp aws_dynamodb_table.tflock "$TABLE"
          fi
          if aws iam get-user --user-name "$IAM_USER" >/dev/null 2>&1; then
            imp aws_iam_user.deployer "$IAM_USER"
            ATTACHED=$(aws iam list-attached-user-policies --user-name "$IAM_USER" --query 'AttachedPolicies[].PolicyArn' --output text)
            grep -q "policy/PowerUserAccess" <<<"$ATTACHED" && imp aws_iam_user_policy_attachment.power_user "$IAM_USER/arn:aws:iam::aws:policy/PowerUserAccess"
            grep -q "policy/IAMFullAccess" <<<"$ATTACHED" && imp aws_iam_user_policy_attachment.iam_full "$IAM_USER/arn:aws:iam::aws:policy/IAMFullAccess"
          fi
          true

      - name: Terraform Plan
        run: |
          if [[ "${{ github.event.inputs.action }}" == "apply" ]]; then
            terraform plan -out=tfplan
          else
            terraform plan -destroy -out=tfplan
          fi

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Display Created Resources (Apply Only)
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          NEW_USER=$(terraform output -raw aws_iam_user_name)
          NEW_BUCKET=$(terraform output -raw aws_state_bucket)
          NEW_TABLE=$(terraform output -raw aws_lock_table)

          echo "=========================================================="
          echo " ✅ AWS Foundational Setup Succeeded!"
          echo "=========================================================="
          echo " Next: create an access key for IAM user '$NEW_USER' in the"
          echo " AWS console and pass it to the Deploy Kubernetes Cluster workflow as:"
          echo "   aws_access_key_id / aws_secret_access_key"
          echo ""
          echo " Save these values for the EKS Cluster Deployment pipeline:"
          echo "   aws_region            : ${{ github.event.inputs.aws_region }}"
          echo "   aws_state_bucket      : $NEW_BUCKET"
          echo "   aws_lock_table        : $NEW_TABLE"
          echo "=========================================================="

      - name: Cleanup
        if: always()
        run: rm -f tfplan
