name: Mahesh GCP Bootstrap Infra 

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy
      gcp_sa_key_base64:
        description: 'GCP Service Account JSON key base64 single-line. If blank, secrets.MAHESH_GCP_SERVICE_ACCOUNT_KEY is used.'
        required: false
        type: string
      gcp_backend_bucket:
        description: 'GCS bucket name for Terraform backend'
        required: true
        default: 'crack-detection-terraform'
        type: choice
        options:
          - crack-detection-terraform
          - crack-detection-terraform-1

jobs:
  terraform-bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gcp-bootstrap-mahesh

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Decode GCP Service Account Key
        if: ${{ github.event.inputs.gcp_sa_key_base64 != '' }}
        run: |
          DECODED_KEY=$(echo "${{ github.event.inputs.gcp_sa_key_base64 }}" | base64 -d | tr -d '\r\n')
          echo "::add-mask::$DECODED_KEY"
          echo "DECODED_GCP_SA_KEY=$DECODED_KEY" >> $GITHUB_ENV

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ env.DECODED_GCP_SA_KEY || secrets.MAHESH_GCP_SERVICE_ACCOUNT_KEY }}'

      - name: Debug - List files
        run: ls -la ./
        working-directory: ${{ github.workspace }}
        
      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ github.event.inputs.gcp_backend_bucket || 'crack-detection-terraform' }}"
        
      - name: Terraform Plan (Apply)
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform plan -input=false

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -auto-approve

      - name: Terraform Plan (Destroy with targets)
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          terraform plan -destroy -input=false \
            -target=google_service_account.crack_detection_sa \
            -target=google_project_iam_member.sa_roles \
            -target=google_dns_managed_zone.crack_dns \
            -target=google_dns_record_set.root_a_record \
            -target=google_dns_record_set.www_a_record

      - name: Terraform Destroy (with targets)
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          terraform destroy -auto-approve \
            -target=google_service_account.crack_detection_sa \
            -target=google_project_iam_member.sa_roles \
            -target=google_dns_managed_zone.crack_dns \
            -target=google_dns_record_set.root_a_record \
            -target=google_dns_record_set.www_a_record